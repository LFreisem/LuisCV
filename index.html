:root {
  --ink: #111;
  --soft: #6f6f6f;
  --line: #d9d9d9;
  --ring: #4f8fcf;
  --hover: #f3f6fa;
  --flash: rgba(79, 143, 207, 0.22);
  --bar: #000;
  --ok: #2f6b3f;
  --err: #8c3030;
  --datecol: 150px;
  --radius: 3px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font-family: "CMU Sans", "Latin Modern Sans", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

.app { max-width: 940px; margin: 0 auto; padding: 44px 28px 72px; }

h1, h2, h3 { font-weight: 400; margin: 0; }
b, strong { font-weight: 700; }
i, em { font-style: italic; }
a { color: inherit; }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; background: #f3f3f3; padding: 2px 6px; border-radius: 2px; }

.label { font-size: 13px; font-style: italic; color: var(--soft); }

/* ---------- CV-KOPF ---------- */
.cv-head {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-areas: "contact name photo";
  align-items: center;
  column-gap: 24px;
  margin-bottom: 30px;
}
.cv-contact { grid-area: contact; font-style: italic; color: var(--soft); font-size: 13.5px; line-height: 1.8; align-self: start; padding-top: 2px; min-width: 0; overflow-wrap: anywhere; }
.cv-contact a { color: inherit; text-decoration: none; }
.cv-contact a:hover { text-decoration: underline; }
.cv-name { grid-area: name; text-align: center; }
.cv-name h1 { font-size: clamp(34px, 6.2vw, 52px); line-height: 1.05; letter-spacing: 0.005em; }
.cv-name .role { font-style: italic; font-size: clamp(18px, 3vw, 25px); margin-top: 2px; }
.cv-photo { grid-area: photo; justify-self: end; }
.cv-photo img { display: block; width: clamp(96px, 17vw, 152px); height: auto; }

/* ---------- ABSCHNITTE ---------- */
.sec-head {
  display: grid;
  grid-template-columns: var(--datecol) 1fr;
  column-gap: 14px;
  align-items: center;
  margin: 30px 0 8px;
}
.sec-head .bar { display: block; height: 9px; background: var(--bar-bg, var(--bar)); }
html.themed body::before { content: ""; display: block; height: 6px; background: var(--bar-bg, var(--bar)); }
.sec-head h2 { font-size: 23px; line-height: 1.2; }

.hint {
  margin: 0 0 6px calc(var(--datecol) + 14px);
  font-size: 12.5px; font-style: italic; color: var(--soft);
}

/* ---------- EINTRÄGE ---------- */
.entry {
  position: relative;
  display: grid;
  grid-template-columns: var(--datecol) 1fr;
  column-gap: 14px;
  padding: 6px 34px 6px 12px;
  margin: 0 -12px;
  border-radius: 4px;
}
.entry .when { text-align: right; font-size: 14.5px; line-height: 1.5; }
.entry .body { font-size: 14.5px; min-width: 0; }
.entry .l1, .entry .l2 { line-height: 1.5; }

.entry.clickable { cursor: pointer; transition: background .12s ease; -webkit-tap-highlight-color: transparent; }
.entry.clickable:hover { background: var(--hover); }
.entry.clickable:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.entry .chev {
  position: absolute; right: 10px; top: 7px;
  color: #a9b3bf; line-height: 0;
  transition: transform .12s ease, color .12s ease;
}
.entry.clickable:hover .chev { color: var(--ink); transform: translateX(3px); }

ul.cvlist { list-style: none; margin: 2px 0 0; padding: 0; font-size: 13.5px; }
ul.cvlist li { position: relative; padding-left: 18px; margin: 1px 0; line-height: 1.45; }
ul.cvlist li::before {
  content: ""; position: absolute; left: 1px; top: .5em;
  width: 7px; height: 7px; border: 1.3px solid var(--ring); border-radius: 50%;
}

.skill { display: grid; grid-template-columns: var(--datecol) 1fr; column-gap: 14px; margin: 9px 0; font-size: 14.5px; }
.skill .lab { text-align: right; }
.skill .val { min-width: 0; }

footer.page-footer {
  margin-top: 54px; padding-top: 14px; border-top: 1px solid var(--line);
  font-size: 12.5px; font-style: italic; color: var(--soft);
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}

/* ---------- DETAILSEITE ---------- */
.topnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 13.5px; }
.topnav .viewer { font-style: italic; color: var(--soft); font-size: 12.5px; }
.backlink {
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
  background: none; border: 0; padding: 6px 8px 6px 0; font: inherit; color: var(--ink);
}
.backlink:hover { text-decoration: underline; }

.dgrid { display: grid; grid-template-columns: var(--datecol) 1fr; column-gap: 14px; }
.dgrid .when { text-align: right; font-size: 14.5px; padding-top: 10px; }
.dgrid .main { min-width: 0; }
.d-title { font-size: clamp(22px, 3.4vw, 28px); font-weight: 700; line-height: 1.2; margin-top: 4px; }
.d-org { font-size: 17px; margin-top: 4px; }
.dgrid ul.cvlist { margin-top: 10px; font-size: 14.5px; }

.gallery { display: grid; gap: 12px; margin: 24px 0 4px; }
.gallery.n1 { grid-template-columns: 1fr; }
.gallery.n2 { grid-template-columns: 1fr 1fr; }
.gallery.many { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.photo-slot {
  position: relative; aspect-ratio: 4 / 3; overflow: hidden;
  background: #f1f1f1; border: 1px solid var(--line); border-radius: 2px;
}
.gallery.n1 .photo-slot { aspect-ratio: 16 / 10; }
.photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-slot.clickable img { cursor: zoom-in; }
.photo-slot img.loading { opacity: 0.3; }

.detail-story { font-size: 16.5px; line-height: 1.72; margin: 24px 0; max-width: 660px; white-space: pre-line; }

.subsections { margin-top: 30px; border-bottom: 1px solid var(--ink); }
.subsection { border-top: 1px solid var(--ink); }
.subsection > summary {
  list-style: none; cursor: pointer; position: relative;
  padding: 13px 36px 13px 0; font-weight: 700; font-size: 16px; line-height: 1.35;
}
.subsection > summary::-webkit-details-marker { display: none; }
.subsection > summary::after {
  content: "+"; position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  font-weight: 400; font-size: 24px; line-height: 1;
}
.subsection[open] > summary::after { content: "\2212"; }
.subsection-body { padding: 0 0 18px; max-width: 680px; }
.detail-sub-text { font-size: 15.5px; line-height: 1.7; margin: 0 0 10px; white-space: pre-line; }
.subsection-body ul.cvlist { font-size: 14.5px; margin-top: 8px; }

.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); }
.pg { background: none; border: 0; padding: 6px 0; font: inherit; font-size: 15px; color: var(--ink); cursor: pointer; text-align: left; max-width: 48%; }
.pg.next { text-align: right; margin-left: auto; }

.stat-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }

.entry-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; background: #fafafa; }

.empty-note { font-size: 13.5px; color: var(--soft); font-style: italic; padding: 10px 0; }

.loading-state { text-align: center; padding: 60px 0; color: var(--soft); font-size: 14px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: var(--radius); font-size: 14px; z-index: 50; box-shadow: 0 4px 14px rgba(0,0,0,.25); max-width: 90vw; }

.photo-admin-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }

@media (max-width: 680px) {
  :root { --datecol: 100%; }

  .cv-head { grid-template-columns: 1fr 96px; grid-template-areas: "name photo" "contact contact"; row-gap: 14px; column-gap: 14px; margin-bottom: 18px; }
  .cv-name { text-align: left; }
  .cv-photo img { width: 96px; }
  .cv-contact { font-size: 13px; line-height: 1.7; }

  .sec-head, .login-card .sec-head { grid-template-columns: 1fr; row-gap: 6px; margin-top: 26px; }

  .login-card .sec-head .bar { width: 64px; }

  .entry { grid-template-columns: 1fr; row-gap: 1px; padding: 8px 30px 8px 12px; }

// ---------- storage helpers (Firestore) ----------
const FS_COLLECTION = "cv_app";

async function waitForFirebase() {
  let tries = 0;
  while (!window.__fbReady && tries < 100) {
    await new Promise(r => setTimeout(r, 50));
    tries++;
  }
}

// Liest ein Dokument; ok=false heißt: Lesefehler (nicht "Dokument leer"), damit niemand
// mit einem leeren Stand weiterarbeitet und bestehende Daten überschreibt.
async function storageRead(key) {
  await waitForFirebase();
  try {
    const { doc, getDoc, db } = window.__fb;
    const snap = await getDoc(doc(db, FS_COLLECTION, key));
    if (!snap.exists()) return { ok: true, value: null };
    const data = snap.data();
    return { ok: true, value: data && typeof data.value === "string" ? data.value : null };
  } catch (e) {
    console.error("storageGet error", e);
    return { ok: false, value: null };
  }
}
async function storageGet(key) {
  return (await storageRead(key)).value;
}
async function storageSet(key, value) {
  await waitForFirebase();
  try {
    const { doc, setDoc, db } = window.__fb;
    await setDoc(doc(db, FS_COLLECTION, key), { value });
    STATE.lastSaveError = "";
    return true;
  } catch (e) {
    console.error("storageSet error", e);
    STATE.lastSaveError = (e && (e.code || e.message)) || "unbekannter Fehler";
    return false;
  }
}

        if (s && !s.id) { const m = secIds.find(([re]) => re.test(s.title || "")); if (m) s.id = m[1]; }
        if (s && s.id === "konstruktion" && typeof s.text === "string") {
          s.text = s.text.replace("in PTC Creo (ergänzend Autodesk Fusion 360)", "in PTC Creo");
        }
      });
      if (!h2.sections.some(s => s && /Simulation/i.test(s.title || ""))) h2.sections.unshift(cp(NEW_H2_SIM));
    }

    const ft = byId.fasttube;
    if (ft) {
      if (!Array.isArray(ft.sections)) ft.sections = [];
      NEW_FASTTUBE_SECTIONS.forEach(ns => {
        if (!ft.sections.some(s => s && low(s.title) === low(ns.title))) ft.sections.push(cp(ns));
      });
    }

    const por = byId.porsche;
    if (por && typeof por.story === "string" && por.story.startsWith("Fünf Monate im Entwicklungszentrum")) {
      por.story = por.story.replace("Fünf Monate", "Sechs Monate");
    }
    (c.projects || []).forEach(p => {
      if (p && Array.isArray(p.bullets)) p.bullets.forEach((b, i) => {
        if (b === "2021: Teammitglied Fertigung und Konstruktion") p.bullets[i] = "2021: Teammitglied Motorapplikation am Prüfstand";
      });
    });

    const ab = byId.abitur;
    if (ab && !String(ab.story || "").trim()) ab.story = ABITUR_STORY;

    if (!Array.isArray(c.hobbies) || !c.hobbies.length) c.hobbies = [cp(BOXEN_ENTRY)];
    if (!c.skillPages) c.skillPages = cp(DEFAULT_SKILL_PAGES);
    return true;
  },

  /* FaSTTUBe ausgebaut: längere Stationsgeschichte, mehr Inhalt in den Abschnitten, neuer Abschnitt
     "Werkstatt, Kran und Hochvolt". Ersetzt nur Texte, die noch exakt dem alten Standard entsprechen. */
  "fasttube-expand-v1": (c) => {
    const cp = (o) => JSON.parse(JSON.stringify(o));
    const low = (t) => String(t || "").trim().toLowerCase();
    const ft = (Array.isArray(c.experience) ? c.experience : []).find(x => x && x.id === "fasttube");
    if (ft) {
      if (typeof ft.story === "string" && ft.story.trim() === FASTTUBE_V1.story) ft.story = FASTTUBE_STORY_V2;
      if (!Array.isArray(ft.sections)) ft.sections = [];
      Object.entries(FASTTUBE_V1.sections).forEach(([id, oldText]) => {
        const cur = ft.sections.find(s => s && s.id === id);
        const nw = NEW_FASTTUBE_SECTIONS.find(s => s.id === id);
        if (cur && nw && cur.text === oldText) cur.text = nw.text;
      });
      const wk = NEW_FASTTUBE_SECTIONS.find(s => s.id === "werkstatt");
      if (!ft.sections.some(s => s && (s.id === "werkstatt" || low(s.title) === low(wk.title)))) {
        const i = ft.sections.findIndex(s => s && s.id === "fertigung");
        ft.sections.splice(i >= 0 ? i + 1 : ft.sections.length, 0, cp(wk));
      }
    }
    const sp = c.skillPages;
    if (sp && typeof sp === "object") {
      FASTTUBE_V1.skillBlocks.forEach(u => {
        const page = sp[u.key];
        if (!page || !Array.isArray(page.blocks)) return;
        const b = page.blocks.find(x => x && x.ref === u.ref && (x.sub || null) === (u.sub || null) && x.text === u.old);
        if (!b) return;
        b.text = u.text;
        if (u.newSub) b.sub = u.newSub;
      });
      FASTTUBE_V1.addBlocks.forEach(a => {
        const page = sp[a.key];
        if (!page || !Array.isArray(page.blocks)) return;
        if (page.blocks.some(x => x && x.ref === a.block.ref && x.sub === a.block.sub)) return;
        const i = page.blocks.findIndex(x => x && x.ref === a.afterRef && x.sub === a.afterSub);
        if (i < 0) return;   // Seite wurde umgebaut: nichts erzwingen
        page.blocks.splice(i + 1, 0, cp(a.block));
      });
    }
    return true;
  },

  /* Porsche: Tätigkeiten aus dem Praktikumszeugnis. Ersetzt nur die alte Ein-Zeilen-Standardfassung. */
  "porsche-tasks-v1": (c) => {
    const list = Array.isArray(c.experience) ? c.experience : [];
    const por = list.find(x => x && x.id === "porsche") || list.find(x => x && !x.id && /Porsche/i.test(x.org || ""));
    if (por && Array.isArray(por.bullets) && por.bullets.length === 1 && String(por.bullets[0]).trim() === PORSCHE_BULLET_V1) {
      por.bullets = PORSCHE_TASKS.slice();
    }
    return true;
  },

  /* ETAS: Aufgaben aus der Tätigkeitsbeschreibung. Ersetzt nur die alte Standardzeile, andere Zeilen bleiben. */
  "etas-tasks-v1": (c) => {
    const list = Array.isArray(c.experience) ? c.experience : [];
    const etas = list.find(x => x && x.id === "etas") || list.find(x => x && !x.id && /ETAS/i.test(x.org || ""));
    if (etas && Array.isArray(etas.bullets)) {
      const i = etas.bullets.findIndex(b => String(b).trim() === ETAS_BULLET_V1);
      if (i >= 0) etas.bullets.splice(i, 1, ...ETAS_TASKS);
    }
    return true;
  },

  /* Studium: Module aus Studiendokumentation und Modulhandbuch als Unterabschnitte. Ergänzt nur, was fehlt. */
  "studium-modules-v1": (c) => {
    const edu = Array.isArray(c.education) ? c.education : [];
    const find = (id, re) => edu.find(x => x && x.id === id) || edu.find(x => x && !x.id && re.test(x.title || ""));
    const addSections = (e, secs) => {
      if (!e) return;
      if (!Array.isArray(e.sections)) e.sections = [];
      secs.forEach(s => {
        if (!e.sections.some(x => x && x.id === s.id)) e.sections.push(JSON.parse(JSON.stringify(s)));
      });
    };
    addSections(find("master", /Master/i), STUDIUM_MASTER_SECTIONS);
    addSections(find("bachelor", /Bachelor/i), STUDIUM_BACHELOR_SECTIONS);
    const sp = c.skillPages && typeof c.skillPages === "object" ? c.skillPages : null;
    if (sp) STUDIUM_SKILL_BLOCKS.forEach(({ skill, block }) => {
      const page = sp[skill];
      if (!page || page.alias || page.direct) return;
      if (!Array.isArray(page.blocks)) page.blocks = [];
      if (!page.blocks.some(b => b && b.ref === block.ref && (b.sub || "") === block.sub)) page.blocks.push(Object.assign({}, block));
    });
    return true;
  },

  /* Studium kürzen: keine belegten (laufenden) Module, keine Verweise auf Dokumente, keine unbelegten Python-/Matlab-Aussagen.
     Ersetzt nur Texte, die noch den Stand von "studium-modules-v1" haben. */
  "studium-trim-v1": (c) => {
    const edu = Array.isArray(c.education) ? c.education : [];
    const find = (id, re) => edu.find(x => x && x.id === id) || edu.find(x => x && !x.id && re.test(x.title || ""));
    const master = find("master", /Master/i);
    const bachelor = find("bachelor", /Bachelor/i);
    if (master && Array.isArray(master.sections)) {
      const best = master.sections.find(s => s && s.id === "bestanden");
      if (best && String(best.text || "").trim() === STUDIUM_V1.masterBestandenText) best.text = STUDIUM_MASTER_SECTIONS[0].text;
      const i = master.sections.findIndex(s => s && s.id === "wise2627" && String(s.title || "").trim() === STUDIUM_V1.masterWiseTitle);
      if (i >= 0) master.sections.splice(i, 1);
    }
    if (bachelor && Array.isArray(bachelor.sections)) {
      Object.entries(STUDIUM_V1.bachelor).forEach(([id, rep]) => {
        const sec = bachelor.sections.find(s => s && s.id === id);
        if (!sec) return;
        if (rep.text && String(sec.text || "").trim() === rep.text[0]) sec.text = rep.text[1];
        (rep.bullets || []).forEach(([from, to]) => {
          if (!Array.isArray(sec.bullets)) return;
          const k = sec.bullets.findIndex(b => String(b).trim() === from);
          if (k >= 0) sec.bullets[k] = to;
        });
      });
    }
    const sp = c.skillPages && typeof c.skillPages === "object" ? c.skillPages : null;
    if (sp) {
      const pm = sp["Projektmanagement"];
      if (pm && Array.isArray(pm.blocks)) {
        const b = pm.blocks.find(x => x && x.ref === "master" && x.sub === "bestanden");
        if (b && String(b.text || "").trim() === STUDIUM_V1.pmBlockText) b.text = STUDIUM_SKILL_BLOCKS[0].block.text;
      }
      const py = sp["Python"];
      if (py && Array.isArray(py.blocks)) {
        const k = py.blocks.findIndex(x => x && x.ref === "bachelor" && x.sub === "grundlagen" && String(x.text || "").trim() === STUDIUM_V1.pythonBlockText);
        if (k >= 0) py.blocks.splice(k, 1);
      }
    }
    return true;
  },

  /* MATLAB als Kenntnis (nach Python), verknüpft mit Porsche. Bestehende Einträge und Seiten bleiben unangetastet. */
  "matlab-skill-v1": (c) => {
    const groups = Array.isArray(c.skillGroups) ? c.skillGroups : [];
    const hard = groups.find(g => g && g.label === "Hardskills");
    if (hard && Array.isArray(hard.items) && !hard.items.some(x => String(x).trim().toLowerCase() === "matlab")) {
      const i = hard.items.indexOf("Python");
      hard.items.splice(i >= 0 ? i + 1 : hard.items.length, 0, "MATLAB");
    }
    if (!c.skillPages || typeof c.skillPages !== "object") c.skillPages = {};
    if (!c.skillPages["MATLAB"]) c.skillPages["MATLAB"] = JSON.parse(JSON.stringify(MATLAB_SKILL_PAGE));
    return true;
  }
};
function applyContentPatches(content) {
  if (!Array.isArray(content._patches)) content._patches = [];
  let changed = false;
  for (const [id, fn] of Object.entries(CONTENT_PATCHES)) {
    if (content._patches.includes(id)) continue;
    if (fn(content)) { content._patches.push(id); changed = true; }
  }
  return changed;
}

async function loadContent() {
  const raw = await storageGet(TOPIC_KEY);
  if (!raw) {
    const fresh = JSON.parse(JSON.stringify(DEFAULT_CONTENT));
    applyContentPatches(fresh);
    await storageSet(TOPIC_KEY, JSON.stringify(fresh));
    return fresh;
  }
  let content;
  try { content = JSON.parse(raw); } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_CONTENT)); }
  if (applyContentPatches(content)) await storageSet(TOPIC_KEY, JSON.stringify(content));
  return content;
}
async function saveContent(content) {
  return storageSet(TOPIC_KEY, JSON.stringify(content));
}

async function loadCompanies() {
  const raw = await storageGet(COMPANIES_KEY);
  if (!raw) return {};
  try { return JSON.parse(raw); } catch (e) { return {}; }

}

function genCode(len) {
  const chars = "abcdefghjkmnpqrstuvwxyz23456789";
  let s = "";
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function genPassword() {
  const words = ["fasttube", "presskit", "fuelcell", "porsche24", "blueprint", "torque", "headwind", "machwerk", "leichtbau", "kennlinie"];
  return words[Math.floor(Math.random() * words.length)] + "-" + genCode(4);
}

function fmtDate(ts) {
  if (!ts) return "–";
  const d = new Date(ts);
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) +
         " " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(str) {
  if (str == null) return "";
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}


/* ============================================================
   APP STATE & ROUTING
   route examples: {view:'login'} {view:'home', code} {view:'detail', code, page:'experience'}
                   {view:'admin_login'} {view:'admin'}
   ============================================================ */

let STATE = {
  content: null,
  companies: null,
  adminPw: null,
  route: { view: "login" },
  loginError: "",
  adminLoginError: "",
  toast: null,
  isAdminAuthed: false,
};

const SCROLL_POS = {};
function routeId(r) {
  return [r.view, r.code || "", r.key || "", r.index == null ? "" : r.index, r.name || "", r.sub || ""].join("|");
}

function setRoute(route) {
  SCROLL_POS[routeId(STATE.route)] = window.scrollY;
  STATE.route = route;
  STATE.pendingSub = route.sub || null;      // Deep-Link: Unterabschnitt nach dem Rendern ansteuern
  history.pushState(route, "");
  render();
  if (!route.sub) window.scrollTo(0, 0);
}

window.addEventListener("popstate", function(e) {
  SCROLL_POS[routeId(STATE.route)] = window.scrollY;
  STATE.route = e.state || { view: "login" };
  STATE.pendingSub = null;
  render();
  window.scrollTo(0, SCROLL_POS[routeId(STATE.route)] || 0);
});

// Meldung als eigenes Element einblenden – ohne die Seite neu aufzubauen,
// damit nichts verworfen wird, was gerade eingetippt wird.
// (Wer danach die Ansicht aktualisieren muss, ruft render() selbst auf.)
let toastTimer = null;
function showToast(msg, isError) {
  let el = document.getElementById("toast-live");
  if (!el) { el = document.createElement("div"); el.id = "toast-live"; document.body.appendChild(el); }
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { const t = document.getElementById("toast-live"); if (t) t.remove(); }, isError ? 7000 : 2200);
}

// Speichert den Inhalt und meldet ehrlich, ob die Datenbank ihn angenommen hat.
async function persistContent(okMsg) {
  const ok = await saveContent(STATE.content);
  STATE.saveFailed = !ok;
  if (!ok) {
    showToast("Speichern fehlgeschlagen" + (STATE.lastSaveError ? " (" + STATE.lastSaveError + ")" : "") + " – Änderungen sind NICHT gesichert.", true);
  } else if (okMsg) {
    showToast(okMsg);
  }
  return ok;
}
window.addEventListener("beforeunload", (e) => {
  if (STATE.saveFailed) { e.preventDefault(); e.returnValue = ""; }
});

async function init() {
  document.getElementById("root").innerHTML = '<div class="loading-state">Lade Inhalte …</div>';
  STATE.content = await loadContent();
  STATE.companies = await loadCompanies();
  STATE.adminPw = await loadAdminPw();
  history.replaceState(STATE.route, "");
  render();
}

/* ============================================================
   RENDER: LOGIN
   ============================================================ */
function renderLogin() {
  const c = STATE.content || {};
  return `
  <div class="app">
    <div class="login-wrap">
      <div class="login-card">
        <h1>${escapeHtml(c.name || "")}</h1>
        <div class="role">${escapeHtml(c.role || "")}</div>
        <div class="sec-head"><span class="bar"></span><h2>Zugang</h2></div>
        <div class="sub">Bitte das bereitgestellte Zugangswort eingeben.</div>
        ${STATE.loginError ? `<div class="error-msg">${escapeHtml(STATE.loginError)}</div>` : ""}
        <form id="login-form">
          <div class="field">
            <label for="pw-input">Passwort</label>
            <input id="pw-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="z. B. fasttube-7x2k" />
          </div>
          <button type="submit" class="btn full">Zugang öffnen</button>
        </form>
        <div class="admin-link"><a id="goto-admin">Admin-Zugang</a></div>
      </div>
    </div>
  </div>`;
}

function attachLoginHandlers() {
  const form = document.getElementById("login-form");
  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const val = document.getElementById("pw-input").value.trim();
      if (!val) return;
      // aktuellen Stand holen: Sperren/Ablauf/neue Passwörter gelten sofort, auch bei offener Seite
      const fresh = await loadCompaniesChecked();
      if (fresh) STATE.companies = fresh;
      const match = Object.entries(STATE.companies || {}).find(([code, c]) => c.password === val);
      if (!match) {
        STATE.loginError = "Dieses Passwort ist nicht gültig. Bitte prüfen und erneut versuchen.";
        render();
        return;
      }
      const [code, company] = match;
      const st = companyStatus(company);
      if (st !== "active") {
        await recordBlocked(code, st);
        STATE.loginError = accessMessage(st);
        render();
        return;
      }
      await updateCompany(code, (co) => {
        if (!co.opened) { co.opened = true; co.openedAt = Date.now(); }
        co.logins = (co.logins || 0) + 1;
        co.lastLoginAt = Date.now();
      });
      logEvent(code, "login", "", "Mit Passwort angemeldet");
      STATE.loginError = "";
      await loadTailor(code);
      setRoute({ view: "home", code });
    });
  }
  const adminLink = document.getElementById("goto-admin");
  if (adminLink) {
    adminLink.addEventListener("click", () => setRoute({ view: "admin_login" }));
  }
}

/* ============================================================
   FIRMENFARBE: Akzent (Balken, Aufzählungsringe, Hover) je Bewerbung
   ============================================================ */
function safeHex(h) {
  const m = /^#([0-9a-f]{6})$/i.exec(String(h || "").trim());
  return m ? "#" + m[1].toLowerCase() : "";
}
function hexToRgb(h) {
  const n = parseInt(safeHex(h).slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function relLum(rgb) {
  const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}
/* Hintergrund für Swatches: einfarbig oder Verlauf (Akzent -> zweite Farbe) */
function swatchBg(a, b) {
  const h = safeHex(a), h2 = safeHex(b);
  if (!h) return "";
  return h2 ? `linear-gradient(90deg, ${h}, ${h2})` : h;
}
/* hex2 (optional): zweite Farbe, erzeugt einen Verlauf in den Balken (wie im Logo der Firma) */
function applyTheme(hex, hex2) {
  const root = document.documentElement;
  let meta = document.querySelector('meta[name="theme-color"]');
  const h = safeHex(hex);
  if (!h) {
    ["--bar", "--bar-bg", "--ring", "--hover", "--flash"].forEach(p => root.style.removeProperty(p));
    root.classList.remove("themed");
    if (meta) meta.remove();
    return;
  }
  const rgb = hexToRgb(h);
  const L = relLum(rgb);
  // sehr helle Farben für dünne Elemente (Ringe, Fokus, Balken) abdunkeln, damit sie auf Weiß sichtbar bleiben
  const ink = L > 0.45 ? rgb.map(v => Math.round(v * 0.6)) : rgb;
  const bar = L > 0.8 ? ink : rgb;
  root.style.setProperty("--bar", `rgb(${bar.join(",")})`);
  const h2 = safeHex(hex2);
  if (h2) {
    const rgb2 = hexToRgb(h2);
    const bar2 = relLum(rgb2) > 0.8 ? rgb2.map(v => Math.round(v * 0.6)) : rgb2;
    root.style.setProperty("--bar-bg", `linear-gradient(90deg, rgb(${bar.join(",")}), rgb(${bar2.join(",")}))`);
  } else {
    root.style.removeProperty("--bar-bg");
  }
  root.style.setProperty("--ring", `rgb(${ink.join(",")})`);
  root.style.setProperty("--hover", `rgba(${rgb.join(",")},0.08)`);
  root.style.setProperty("--flash", `rgba(${ink.join(",")},0.22)`);
  root.classList.add("themed");
  if (!meta) { meta = document.createElement("meta"); meta.name = "theme-color"; document.head.appendChild(meta); }
  meta.content = h;
}

async function updateCompanyAccent(code, hex) {
  const fresh = await loadCompanies();
  if (!fresh[code]) return;
  const h = safeHex(hex);
  if (h) fresh[code].accent = h; else { delete fresh[code].accent; delete fresh[code].accent2; }
  await saveCompanies(fresh);
  STATE.companies = fresh;
}
async function updateCompanyAccentAndRefresh(code, hex, msg) {
  await updateCompanyAccent(code, hex);
  render();
  showToast(msg);
}

  experience: "Berufserfahrung",
  education: "Ausbildung",
  projects: "Projekte & Highlights",
  hobbies: "Hobbys"
};

  experience: "Berufserfahrung",
  education: "Ausbildung",
  skills: "Skills & Sprachen",
  projects: "Projekte & Highlights"
};

const ICON_CHEVRON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_BACK = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function isNote(b) { return /^Note:/i.test(String(b || "").trim()); }

// "H2Power n Heat, Berlin" -> <i>H2Power n Heat</i>, Berlin
function orgHtml(org) {
  org = String(org || "").trim();
  if (!org) return "";
  const i = org.indexOf(",");
  if (i < 0) return `<i>${escapeHtml(org)}</i>`;
  return `<i>${escapeHtml(org.slice(0, i))}</i>${escapeHtml(org.slice(i))}`;
}

function hasSubsections(e) {
  return Array.isArray(e.sections) && e.sections.some(s => s && (s.title || s.text || (s.bullets && s.bullets.length)));
}
function hasDetail(e) {
  if (!e) return false;
  return !!((e.story && String(e.story).trim()) || hasSubsections(e) || (Array.isArray(e.photos) && e.photos.some(isRealPhoto)));
}

function bulletList(items) {
  return items.length ? `<ul class="cvlist">${items.map(b => `<li>${escapeHtml(b)}</li>`).join("")}</ul>` : "";
}

function entryTitleHtml(e) {
  const notes = (e.bullets || []).filter(isNote);
  const tail = [orgHtml(e.org)].concat(notes.map(escapeHtml)).filter(Boolean).join(", ");
  const len = (e.title || "").length + (e.org || "").length + notes.join(", ").length;
  const title = `<b>${escapeHtml(e.title || "")}</b>`;
  if (!tail) return `<div class="l1">${title}</div>`;
  return len > 78
    ? `<div class="l1">${title}</div><div class="l2">${tail}</div>`
    : `<div class="l1">${title}, ${tail}</div>`;
}

function renderEntryRow(key, e, i, rel) {
  const clickable = hasDetail(e);
  const plain = (e.bullets || []).filter(b => !isNote(b));
  const isRel = !!(rel && e.id && rel.stations.has(e.id));
  const attrs = clickable
    ? `class="entry clickable${isRel ? " rel" : ""}" role="button" tabindex="0" data-key="${key}" data-index="${i}" aria-label="${escapeHtml("Mehr zu: " + (e.title || ""))}"`
    : `class="entry${isRel ? " rel" : ""}"`;
  return `
    <div ${attrs}>
      <div class="when">${escapeHtml(e.when || "")}</div>
      <div class="body">${isRel ? `<div class="relmark">${TAILOR_REL_TEXT}</div>` : ""}${entryTitleHtml(e)}${bulletList(plain)}</div>
      ${clickable ? `<span class="chev">${ICON_CHEVRON}</span>` : ""}
    </div>`;
}

function normTxt(t) { return String(t || "").toLowerCase().trim(); }

// Index der Station in der Berufserfahrung, die ein Projekt schon abdeckt (z. B. FaSTTUBe), sonst -1.
// Solche Projekte werden nicht doppelt gelistet; ihre Fotos erscheinen bei der Station.
function projectCoveredBy(p, c) {
  const pt = normTxt(p && p.title);
  if (!pt) return -1;
  return (c.experience || []).findIndex(e => {
    const t = normTxt(e.title);
    const o = normTxt(String(e.org || "").split(",")[0]);
    return (t && pt.includes(t)) || (o && pt.includes(o));
  });
}

function renderHome(code) {
  const c = STATE.content;
  const company = STATE.companies[code];

  const hidden = (key, i) => key === "projects" && projectCoveredBy((c.projects || [])[i], c) >= 0;
  const sections = [
    { key: "experience", list: c.experience || [] },
    { key: "education", list: c.education || [] }
  ];
  if ((c.projects || []).some((p, i) => !hidden("projects", i))) sections.push({ key: "projects", list: c.projects });

  const phoneHref = String(c.phone || "").replace(/[^\d+]/g, "");
  const li = String(c.linkedin || "");
  const liHref = /^https?:/i.test(li) ? li : "https://" + li;
  const contact = [
    c.location ? `<div>${escapeHtml(c.location)}</div>` : "",
    c.phone ? `<div><a href="tel:${escapeHtml(phoneHref)}">${escapeHtml(c.phone)}</a></div>` : "",
    c.email ? `<div><a href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a></div>` : "",
    li ? `<div><a href="${escapeHtml(liHref)}" target="_blank" rel="noopener">${escapeHtml(li)}</a></div>` : "",
    c.birthInfo ? `<div>${escapeHtml(c.birthInfo)}</div>` : ""
  ].join("");

  const anyClickable = sections.some(s => s.list.some(hasDetail));
  const rel = tailorRel(code);
  const skillRows = (c.skillGroups || [])
    .filter(g => g && (g.items || []).length)
    .map(g => `<div class="skill"><div class="lab">${escapeHtml(g.label)}</div><div class="val">${tailorSortSkills(g.items, rel).map(it => {
      const r = tailorSkillRel(it, rel);
      return skillLinked(it)
        ? `<button class="skilllink${r ? " rel-skill" : ""}" data-skill="${escapeHtml(it)}">${escapeHtml(it)}</button>`
        : (r ? `<span class="rel-skill">${escapeHtml(it)}</span>` : escapeHtml(it));
    }).join(", ")}</div></div>`)
    .join("");
  const anySkillLink = (c.skillGroups || []).some(g => (g.items || []).some(skillLinked));

  return `
  <div class="app">
    <header class="cv-head">
      <div class="cv-contact">${contact}</div>
      <div class="cv-name">

}

/* ============================================================
   ZUGANG: Gültigkeit, Sperren, Ereignisprotokoll
   Hinweis: Das ist eine Zugangsschranke der Seite (und Grundlage der Auswertung),
   kein technischer Schutz – die Inhalte selbst liegen unverschlüsselt in Seite und Datenbank.
   ============================================================ */
const DAY_MS = 86400000;
const DEFAULT_VALID_DAYS = 90;           // Vorgabe für NEUE Bewerbungen; bestehende bleiben unbegrenzt
const EVENTS_PREFIX = "cv_events_";
const EVENT_CAP = 200;                   // so viele Einzelereignisse je Bewerbung werden behalten

function endOfDay(ts) { const d = new Date(ts); d.setHours(23, 59, 59, 999); return d.getTime(); }
function expiryFromDays(days) { return days > 0 ? endOfDay(Date.now() + days * DAY_MS) : null; }
function fmtDay(ts) {
  return ts ? new Date(ts).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "–";
}
function toInputDate(ts) {
  const d = new Date(ts), p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function fromInputDate(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || "");
  return m ? endOfDay(new Date(+m[1], +m[2] - 1, +m[3]).getTime()) : null;
}

// "active" | "expired" | "revoked" | "gone" (Eintrag existiert nicht mehr). Sperre geht vor Ablauf.
function companyStatus(c, now) {
  if (!c) return "gone";
  if (c.revokedAt) return "revoked";
  if (c.expiresAt && c.expiresAt <= (now || Date.now())) return "expired";
  return "active";
}
function accessPill(c) {
  const st = companyStatus(c);
  if (st === "revoked") return `<span class="pill revoked">Gesperrt</span>`;
  if (st === "expired") return `<span class="pill expired">Abgelaufen</span>`;
  return `<span class="pill active">Aktiv</span>`;
}
function validityNote(c) {
  if (c.revokedAt) return "gesperrt seit " + fmtDay(c.revokedAt);
  if (!c.expiresAt) return "unbegrenzt gültig";
  return (c.expiresAt <= Date.now() ? "abgelaufen am " : "gültig bis ") + fmtDay(c.expiresAt);
}
function accessMessage(st) {
  const mail = STATE.content && STATE.content.email ? " Bei Fragen gern per E-Mail: " + STATE.content.email : "";
  if (st === "revoked") return "Dieser Zugang wurde deaktiviert." + mail;
  if (st === "expired") return "Dieser Zugang ist abgelaufen." + mail;
  return "Dieser Zugang ist nicht mehr gültig." + mail;
}

// Ändert EINE Firma: liest vorher neu und schreibt dann, damit Tracking anderer Besucher und
// Admin-Änderungen sich nicht gegenseitig überschreiben. fn(co) darf false liefern = nichts schreiben.
// Ergebnis: { ok, co, gone }
let COMPANY_CHAIN = Promise.resolve();
function updateCompany(code, fn) {
  const run = COMPANY_CHAIN.then(async () => {
    const fresh = await loadCompaniesChecked();
    if (!fresh) return { ok: false, co: null, gone: false };
    const co = fresh[code];
    if (!co) { STATE.companies = fresh; return { ok: true, co: null, gone: true }; }
    if (fn(co) === false) { STATE.companies = fresh; return { ok: true, co, gone: false }; }
    const ok = await saveCompanies(fresh);
    if (ok) STATE.companies = fresh;
    return { ok, co, gone: false };
  }).catch((err) => { console.error("updateCompany", err); return { ok: false, co: null, gone: false }; });
  COMPANY_CHAIN = run;
  return run;
}

// Einzelereignisse je Bewerbung (eigenes Dokument, damit die Firmenliste klein bleibt)
let EVENT_CHAIN = Promise.resolve();
function logEvent(code, type, key, label) {
  if (STATE.isAdminAuthed) return Promise.resolve();       // Vorschau aus dem Admin zählt nicht
  EVENT_CHAIN = EVENT_CHAIN.then(async () => {
    try {
      const r = await storageRead(EVENTS_PREFIX + code);
      if (!r.ok) return;                                    // Lesefehler: lieber ein Ereignis verlieren als das Protokoll
      let list = [];
      if (r.value) { try { list = JSON.parse(r.value); } catch (e) { list = []; } }
      if (!Array.isArray(list)) list = [];
      list.push({ t: type, k: key || "", l: String(label || "").slice(0, 160), at: Date.now() });
      if (list.length > EVENT_CAP) list = list.slice(-EVENT_CAP);
      await storageSet(EVENTS_PREFIX + code, JSON.stringify(list));
    } catch (err) {
      console.error("logEvent", err);
    }
  });
  return EVENT_CHAIN;
}
async function loadEvents(code) {
  const r = await storageRead(EVENTS_PREFIX + code);
  if (!r.ok || !r.value) return [];
  try { const l = JSON.parse(r.value); return Array.isArray(l) ? l : []; } catch (e) { return []; }
}

// Besuche pro Station mitschreiben (Zeitpunkt des letzten Aufrufs + Einzelereignis).
// Prüft dabei nebenbei, ob der Zugang inzwischen abgelaufen/gesperrt/gelöscht wurde.
function trackVisit(code, pageKey) {
  const label = visitedLabel(pageKey, code);
  const type = pageKey.indexOf("skill:") === 0 ? "skill" : pageKey.indexOf("match:") === 0 ? "match" : "station";
  return updateCompany(code, (co) => {
    if (companyStatus(co) !== "active") return false;
    co.pagesVisited = co.pagesVisited || {};
    co.pagesVisited[pageKey] = Date.now();
  }).then((r) => {
    if (!r.ok) return;
    const st = companyStatus(r.co);
    if (st !== "active") { render(); return; }               // render() leitet auf die Anmeldung um
    return logEvent(code, type, pageKey, label);
  });
}

// Fehlversuch auf gesperrten/abgelaufenen Zugang festhalten (Zähler + Protokolleintrag, gedrosselt)
async function recordBlocked(code, st) {
  let log = true;
  await updateCompany(code, (co) => {
    log = Date.now() - (co.lastBlockedAt || 0) > 10 * 60 * 1000;
    co.blocked = (co.blocked || 0) + 1;
    co.lastBlockedAt = Date.now();
  });
  if (log) await logEvent(code, "blocked", st, st === "revoked" ? "Login-Versuch auf gesperrten Zugang" : "Login-Versuch auf abgelaufenen Zugang");
}

function openEntry(code, key, index, sub) {
  // Von Startseite oder Skill-Seite: der Zurück-Link nutzt den Browserverlauf (Scrollposition bleibt erhalten)
  const cur = STATE.route;
  const back = (cur.view === "home" || cur.view === "skill") ? backLabelFor(cur) : "";
  if (!STATE.isAdminAuthed) trackVisit(code, key + ":" + index);   // Vorschau aus dem Admin zählt nicht
  setRoute({ view: "detail", code, key, index, sub: sub || undefined, back: back || undefined });
}

function visitedLabel(k, code) {
  const mm = /^match:(\d+)$/.exec(k);
  if (mm) {
    const co = code && STATE.companies && STATE.companies[code];
    const req = co && co.tailored && Array.isArray(co.tailored.reqs) ? co.tailored.reqs[Number(mm[1])] : "";
    const short = req && req.length > 60 ? req.slice(0, 58) + "…" : req;
    return "Passung: " + (short || "#" + (Number(mm[1]) + 1));
  }
  const m = /^(experience|education|projects|hobbies):(\d+)$/.exec(k);
  if (m) {
    const e = ((STATE.content && STATE.content[m[1]]) || [])[Number(m[2])];
    return e && e.title ? e.title : `${SECTION_TITLES[m[1]]} #${Number(m[2]) + 1}`;
  }
  if (k.indexOf("skill:") === 0) return "Kenntnis: " + skillTitle(k.slice(6));
  return LEGACY_PAGE_TITLES[k] || k;
}

function attachHomeHandlers(code) {
  document.querySelectorAll(".entry.clickable").forEach(el => {
    const go = () => openEntry(code, el.getAttribute("data-key"), parseInt(el.getAttribute("data-index"), 10));
    el.addEventListener("click", go);
    el.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); }
    });
  });
  document.querySelectorAll(".skilllink").forEach(el => {
    el.addEventListener("click", () => openSkill(code, el.getAttribute("data-skill")));
  });
  document.querySelectorAll(".cv-contact a").forEach(a => {
    a.addEventListener("click", () => {
      const href = a.getAttribute("href") || "";
      if (href.indexOf("tel:") === 0) logEvent(code, "contact", "tel", "Telefonnummer angeklickt");
      else if (href.indexOf("mailto:") === 0) logEvent(code, "contact", "mail", "E-Mail-Adresse angeklickt");
      else logEvent(code, "contact", "linkedin", "LinkedIn-Profil geöffnet");
    });
  });
  attachTailorHandlers(code);
  const logout = document.getElementById("logout-link");
  if (logout) {
    logout.addEventListener("click", (e) => {
      e.preventDefault();
      STATE.isAdminAuthed = false;
      setRoute({ view: "login" });
    });
  }
  const toAdmin = document.getElementById("to-admin");
  if (toAdmin) toAdmin.addEventListener("click", (e) => { e.preventDefault(); setRoute({ view: "admin" }); });
}

/* ============================================================
   KENNTNISSE -> STATIONEN: Skill-Seiten, Rück-Links (Chips), Deep-Links
   ============================================================ */
const ICON_ARROW = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ID_LISTS = ["experience", "education", "projects", "hobbies"];

// Stabile IDs für Stationen und Unterabschnitte (Verknüpfungen hängen daran, nicht an Titeln/Positionen)
function ensureIds(c) {
  if (!c) return;
  if (!Array.isArray(c.hobbies)) c.hobbies = [];
  const rnd = () => Math.random().toString(36).slice(2, 6);
  const slug = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 16) || "e";
  const used = new Set();
  ID_LISTS.forEach(k => (c[k] || []).forEach(e => { if (e && e.id) used.add(e.id); }));
  ID_LISTS.forEach(k => (c[k] || []).forEach(e => {
    if (!e) return;
    if (!e.id) { let id; do { id = slug(e.title) + "-" + rnd(); } while (used.has(id)); e.id = id; used.add(id); }
    if (Array.isArray(e.sections)) {
      const su = new Set(e.sections.filter(s => s && s.id).map(s => s.id));
      e.sections.forEach(s => {
        if (s && !s.id) { let id; do { id = slug(s.title) + "-" + rnd(); } while (su.has(id)); s.id = id; su.add(id); }
      });
    }
  }));
}

function entryById(c, id) {
  if (!c || !id) return null;
  for (const key of ID_LISTS) {
    const list = Array.isArray(c[key]) ? c[key] : [];
    const index = list.findIndex(e => e && e.id === id);
    if (index >= 0) return { key, index, entry: list[index] };
  }
  return null;
}
function subById(entry, sid) {
  if (!sid || !entry || !Array.isArray(entry.sections)) return null;
  return entry.sections.find(s => s && s.id === sid) || null;
}
function effSub(b, entry) { return b && b.sub && subById(entry, b.sub) ? b.sub : ""; }

// Seite zu einem Eintrag der Kenntnisse (folgt Verweisen auf andere Seiten)
function resolveSkill(name) {
  const sp = (STATE.content && STATE.content.skillPages) || {};
  let key = name, page = sp[key], n = 0;
  while (page && page.alias && n++ < 3) { key = page.alias; page = sp[key]; }
  return page && typeof page === "object" ? { key, page } : null;
}
function skillTitle(key) {
  const res = resolveSkill(key);
  return res ? (res.page.title || res.key) : key;
}
function skillGroupLabel(key) {
  const g = ((STATE.content && STATE.content.skillGroups) || []).find(x => (x.items || []).includes(key));
  return g ? g.label : "Kenntnisse";
}
function skillBlocks(page) {
  const c = STATE.content;
  return (page.blocks || []).filter(b => b && (!b.ref || entryById(c, b.ref)));
}
function skillLinked(name) {
  const res = resolveSkill(name);
  if (!res) return false;
  const c = STATE.content;
  if (res.page.direct) { const hit = entryById(c, res.page.direct); return !!(hit && hasDetail(hit.entry)); }
  return !!(res.page.intro && String(res.page.intro).trim()) || skillBlocks(res.page).length > 0;
}

// Rück-Links: Kenntnisse, die zu dieser Station (subId = "") bzw. diesem Unterabschnitt führen
function skillChips(entry, subId) {
  if (!entry || !entry.id) return "";
  const sp = (STATE.content && STATE.content.skillPages) || {};
  const names = Object.entries(sp)
    .filter(([, page]) => page && !page.alias && !page.direct && (page.blocks || []).some(b => b && b.ref === entry.id && effSub(b, entry) === (subId || "")))
    .map(([key]) => key);
  if (!names.length) return "";
  return `<div class="chips"><span class="chips-lab">Verknüpfte Kenntnisse</span>${names.map(n =>
    `<button class="chip" data-skill-go="${escapeHtml(n)}">${escapeHtml(skillTitle(n))}</button>`).join("")}</div>`;
}

function backLabelFor(route) {
  const c = STATE.content;
  if (route.view === "home") return "Zurück zum Lebenslauf";
  if (route.view === "skill") return "Zurück zu " + skillTitle(route.name);
  if (route.view === "detail") {
    const e = ((c && c[route.key]) || [])[route.index] || {};
    return "Zurück zu " + (e.title || "Station");
  }
  return "";
}

function openSkill(code, name) {
  const res = resolveSkill(name);
  if (!res) return;
  const c = STATE.content;
  if (res.page.direct) {
    const hit = entryById(c, res.page.direct);
    if (hit) openEntry(code, hit.key, hit.index);
    return;
  }
  const back = backLabelFor(STATE.route);
  if (!STATE.isAdminAuthed) trackVisit(code, "skill:" + res.key);   // Vorschau aus dem Admin zählt nicht
  setRoute({ view: "skill", code, name: res.key, back: back || undefined });
}

function renderSkillPage(code, route) {
  const c = STATE.content;
  const company = STATE.companies[code];
  const res = resolveSkill(route.name);
  const page = res.page;
  const title = page.title || res.key;
  const intro = page.intro && String(page.intro).trim() ? `<div class="sk-intro">${escapeHtml(page.intro)}</div>` : "";

  const blocks = skillBlocks(page).map(b => {
    const hit = b.ref ? entryById(c, b.ref) : null;
    const sub = hit ? subById(hit.entry, b.sub) : null;
    const where = hit
      ? `<div class="sk-where"><span class="sk-when">${escapeHtml(hit.entry.when || "")}</span>${entryTitleHtml(hit.entry)}</div>`
      : (b.label ? `<div class="sk-where"><div class="l1"><b>${escapeHtml(b.label)}</b></div></div>` : "");
    const text = b.text && String(b.text).trim() ? `<div class="sk-text">${escapeHtml(b.text)}</div>` : "";
    const go = hit && hasDetail(hit.entry)
      ? `<button class="sk-go" data-key="${hit.key}" data-index="${hit.index}" data-sub="${sub ? escapeHtml(sub.id) : ""}">Mehr dazu: ${escapeHtml(sub ? sub.title : hit.entry.title)}${ICON_ARROW}</button>`
      : "";
    return `<div class="sk-block">${where}${text}${go}</div>`;
  }).join("");

  return `
  <div class="app">
    <div class="topnav">
      <button class="backlink" id="back-home">${ICON_BACK}<span>${escapeHtml(route.back || "Zurück zum Lebenslauf")}</span></button>
      <span class="viewer">Ansicht für ${escapeHtml(company ? company.name : "")}</span>
    </div>

    <div class="sec-head"><span class="bar"></span><h2>Kenntnisse &amp; Fähigkeiten</h2></div>

    <div class="dgrid">
      <div class="when">${escapeHtml(skillGroupLabel(res.key))}</div>
      <div class="main">
        <h1 class="d-title">${escapeHtml(title)}</h1>
        ${intro}
        ${blocks ? `<div class="sk-blocks">${blocks}</div>` : ""}
      </div>
    </div>

    <footer class="page-footer">
      <span>Vertraulich – nur für ${escapeHtml(company ? company.name : "")} bestimmt</span>
      <span><a href="#" id="logout-link2" style="color:inherit;">Abmelden</a></span>
    </footer>
  </div>`;
}

function attachSkillHandlers(code) {
  const back = document.getElementById("back-home");
  if (back) back.addEventListener("click", () => {
    if (STATE.route.back) history.back();
    else setRoute({ view: "home", code });
  });
  document.querySelectorAll(".sk-go").forEach(btn => {
    btn.addEventListener("click", () => openEntry(code, btn.getAttribute("data-key"), parseInt(btn.getAttribute("data-index"), 10), btn.getAttribute("data-sub") || ""));
  });
  const logout = document.getElementById("logout-link2");
  if (logout) logout.addEventListener("click", (e) => { e.preventDefault(); STATE.isAdminAuthed = false; setRoute({ view: "login" }); });
}

/* ---------- Admin: Skill-Seiten bearbeiten ---------- */
function stationOptionsHtml(c, selId) {
  const groups = [["experience", "Berufserfahrung"], ["education", "Ausbildung"], ["hobbies", "Hobbys"]];
  let o = `<option value="">– keine Station (nur Text) –</option>`;
  groups.forEach(([key, label]) => {
    const list = (c[key] || []).filter(e => e && e.id);
    if (!list.length) return;
    o += `<optgroup label="${label}">` + list.map(e =>
      `<option value="${escapeHtml(e.id)}"${e.id === selId ? " selected" : ""}>${escapeHtml(e.title || "(ohne Titel)")}${e.when ? " – " + escapeHtml(e.when) : ""}</option>`).join("") + `</optgroup>`;
  });
  return o;
}
function subOptionsHtml(c, refId, selSub) {
  const hit = refId ? entryById(c, refId) : null;
  let o = `<option value="">– ganze Station –</option>`;
  if (hit && Array.isArray(hit.entry.sections)) {
    o += hit.entry.sections.filter(s => s && s.id).map(s =>
      `<option value="${escapeHtml(s.id)}"${s.id === selSub ? " selected" : ""}>${escapeHtml(s.title || "(ohne Überschrift)")}</option>`).join("");
  }
  return o;
}

function renderSkillPagesEditor(c) {
  const sp = c.skillPages || {};
  const cards = Object.entries(sp).map(([key, page]) => {
    const k = escapeHtml(key);
    const rm = `<button class="icon-btn danger" data-action="sp-remove-page" data-sp-key="${k}">Entfernen</button>`;
    if (page.alias) {
      return `<div class="entry-card"><div class="entry-card-head"><span><b>${k}</b> <span class="small-note" style="margin:0">öffnet die Seite „${escapeHtml(page.alias)}“</span></span>${rm}</div></div>`;
    }
    if (page.direct) {
      const hit = entryById(c, page.direct);
      return `<div class="entry-card"><div class="entry-card-head"><span><b>${k}</b> <span class="small-note" style="margin:0">öffnet direkt die Detailseite „${escapeHtml(hit ? hit.entry.title : page.direct)}“</span></span>${rm}</div></div>`;
    }
    const blocks = (page.blocks || []).map((b, bi) => `
        <div class="sub-card">
          <div class="sub-card-head">
            <b>Block ${bi + 1}</b>

          </div>
          <div class="editor-field"><label>Station</label><select data-sp-field="ref" data-sp-key="${k}" data-sp-block="${bi}">${stationOptionsHtml(c, b.ref)}</select></div>
          <div class="editor-field"><label>Unterabschnitt (Ziel des Links)</label><select data-sp-field="sub" data-sp-key="${k}" data-sp-block="${bi}">${subOptionsHtml(c, b.ref, b.sub)}</select></div>
          ${b.ref ? "" : `<div class="editor-field"><label>Überschrift (ohne Station)</label><input data-sp-field="label" data-sp-key="${k}" data-sp-block="${bi}" value="${escapeHtml(b.label || "")}"/></div>`}
          <div class="editor-field"><label>Text (1–3 Sätze: wie ich dazu kam)</label><textarea class="editor" data-sp-field="text" data-sp-key="${k}" data-sp-block="${bi}">${escapeHtml(b.text || "")}</textarea></div>
        </div>`).join("");
    return `
    <div class="entry-card">
      <div class="entry-card-head"><b>${k}</b>${rm}</div>
      <div class="editor-field"><label>Seitentitel (optional, z. B. „Claude &amp; Gemini“)</label><input data-sp-field="title" data-sp-key="${k}" value="${escapeHtml(page.title || "")}"/></div>
      <div class="editor-field"><label>Einleitung (optional)</label><textarea class="editor" data-sp-field="intro" data-sp-key="${k}">${escapeHtml(page.intro || "")}</textarea></div>
      <div class="editor-field"><label>Blöcke (je Station einer)</label>${blocks || `<span class="small-note">Noch keine Blöcke.</span>`}
        <div><button class="btn ghost" data-action="sp-add-block" data-sp-key="${k}">+ Block hinzufügen</button></div>
      </div>
    </div>`;
  }).join("");

  const free = (c.skillGroups || []).flatMap(g => g.items || []).filter(it => !sp[it]);
  return `
  <div class="panel">
    <h2>Kenntnisse mit Stationen verknüpfen</h2>
    <div class="small-note" style="margin-top:0">Der Name einer Seite muss genau dem Eintrag in „Skills &amp; Sprachen“ entsprechen. Die Kenntnis wird dann im Lebenslauf anklickbar.</div>
    ${cards || `<div class="empty-note">Noch keine Seiten.</div>`}
    ${free.length ? `<div class="inline-form"><select id="sp-new-item">${free.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join("")}</select><button class="btn ghost" data-action="sp-add-page">Seite anlegen</button></div>` : ""}
    <button class="btn" data-action="sp-save">Speichern</button>
  </div>`;
}

function syncSkillPages() {
  const sp = STATE.content.skillPages || (STATE.content.skillPages = {});
  document.querySelectorAll("[data-sp-field]").forEach(el => {
    const page = sp[el.getAttribute("data-sp-key")];
    if (!page) return;
    const f = el.getAttribute("data-sp-field");
    const b = el.getAttribute("data-sp-block");
    if (b == null) { page[f] = el.value; return; }
    const blk = (page.blocks || [])[parseInt(b, 10)];
    if (blk) blk[f] = el.value;
  });
  Object.values(sp).forEach(p => {
    if (p.title === "") delete p.title;
    if (p.intro === "") delete p.intro;
    (p.blocks || []).forEach(bk => {
      if (!bk.ref) { delete bk.ref; delete bk.sub; } else { delete bk.label; if (!bk.sub) delete bk.sub; }
      if (bk.label === "") delete bk.label;
    });
  });
}

function attachSkillAdminHandlers() {
  const sel = (a) => document.querySelectorAll(`[data-action="${a}"]`);
  sel("sp-save").forEach(btn => btn.addEventListener("click", async () => {

    if (!page) return;
    if (!Array.isArray(page.blocks)) page.blocks = [];

    page.blocks.splice(parseInt(btn.getAttribute("data-block"), 10), 1);

  sel("sp-remove-page").forEach(btn => btn.addEventListener("click", async () => {

    delete STATE.content.skillPages[btn.getAttribute("data-sp-key")];

    render();

    if (blk) blk.sub = "";

/* ============================================================
   ZUSCHNITT PRO BEWERBUNG
   Stufe 1: Überschrift "Bewerbung als …", Einleitung, "Passung zur Stelle" (Anforderung, Antwort, Link)
   Stufe 2: relevante Stationen, Abschnitte und Kenntnisse werden markiert bzw. nach vorn sortiert.
   Der Zuschnitt liegt je Firma in einem eigenen Dokument (tailor_<code>); die Inhalte selbst bleiben unverändert.
   Bewerbungspaket: derselbe JSON-Text kann zusätzlich einen Block "company" {name, password?, accent?} enthalten.
   Im Admin legt "Neue Bewerbung anlegen" daraus Firma, Passwort, Farbe und Zuschnitt in einem Schritt an.
   ============================================================ */
const TAILOR_PREFIX = "tailor_";
const TAILOR_REL_TEXT = "Relevant für diese Stelle";
const TAILOR_LIMITS = { role: 120, intro: 1000, req: 200, ans: 600, matches: 8, list: 12, name: 80, pw: [6, 40] };
const TAILOR_NEW = "__new__";     // Auswahl "Neue Bewerbung anlegen" im Admin

/* ---------- Laden / Speichern ---------- */
async function loadTailor(code) {
  STATE.tailor = STATE.tailor || {};
  if (Object.prototype.hasOwnProperty.call(STATE.tailor, code)) return STATE.tailor[code];
  let t = null;
  try {
    const raw = await storageGet(TAILOR_PREFIX + code);
    if (raw && String(raw).trim()) {
      const res = validateTailor(JSON.parse(raw), STATE.content, { mode: "load" });
      t = res.clean || null;      // Verweise, die inzwischen fehlen, werden beim Anzeigen übersprungen
    }
  } catch (e) {
    console.error("loadTailor", e);
    t = null;
  }
  STATE.tailor[code] = t;
  return t;
}

async function setCompanyTailored(code, info) {
  const fresh = await loadCompanies();
  if (!fresh[code]) return;
  if (info) fresh[code].tailored = info; else delete fresh[code].tailored;
  await saveCompanies(fresh);
  STATE.companies = fresh;
}

/* ---------- Prüfen ---------- */
function tcleanStr(v, max, label, errors, required) {
  if (v == null || v === "") { if (required) errors.push(`${label} fehlt.`); return ""; }
  if (typeof v !== "string") { errors.push(`${label} muss Text sein.`); return ""; }
  const s = v.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "").replace(/\r\n?/g, "\n").trim();
  if (!s) { if (required) errors.push(`${label} fehlt.`); return ""; }
  if (s.length > max) errors.push(`${label} ist zu lang (${s.length} Zeichen, höchstens ${max}).`);
  return s;
}
function tailorNormName(s) { return String(s == null ? "" : s).trim().toLowerCase(); }

function tailorStations(c) {
  const out = [];
  ID_LISTS.forEach(key => (c[key] || []).forEach((e, i) => {
    if (e && e.id) out.push({ key, index: i, id: e.id, title: e.title || e.id, entry: e });
  }));
  return out;
}
function tailorSkillNames(c) {
  const names = [];
  (c.skillGroups || []).forEach(g => (g.items || []).forEach(it => { if (!names.includes(it)) names.push(it); }));
  Object.keys(c.skillPages || {}).forEach(k => { if (!names.includes(k)) names.push(k); });
  return names;
}
function tailorFindSkill(c, name) {
  const n = tailorNormName(name);
  return n ? (tailorSkillNames(c).find(x => tailorNormName(x) === n) || "") : "";
}
function tailorSubIds(entry) {
  return (Array.isArray(entry.sections) ? entry.sections : []).filter(s => s && s.id).map(s => s.id);
}

function tailorCleanLink(l, c, tag, errors, warnings) {
  if (l == null) return null;
  if (typeof l !== "object" || Array.isArray(l)) { errors.push(`${tag}: link muss {"station": "…"} oder {"skill": "…"} sein.`); return null; }
  Object.keys(l).forEach(k => { if (!["station", "sub", "skill"].includes(k)) warnings.push(`${tag}: Unbekanntes Feld "${k}" im Link wird ignoriert.`); });
  const hasSt = l.station != null && l.station !== "";
  const hasSk = l.skill != null && l.skill !== "";
  if (hasSt === hasSk) { errors.push(`${tag}: Der Link braucht genau eines von "station" oder "skill".`); return null; }
  if (hasSk) {
    const nm = tailorFindSkill(c, l.skill);
    if (!nm) {
      const avail = tailorSkillNames(c).filter(skillLinked).join(", ");
      errors.push(`${tag}: Kenntnis "${l.skill}" gibt es nicht. Verlinkbar sind: ${avail}.`);
      return null;
    }
    if (!skillLinked(nm)) { errors.push(`${tag}: Die Kenntnis "${nm}" hat keine eigene Seite, auf die verlinkt werden kann.`); return null; }
    return { skill: nm };
  }
  const id = String(l.station).trim();
  const hit = entryById(c, id);
  if (!hit) {
    errors.push(`${tag}: Station "${id}" gibt es nicht. Verfügbar sind: ${tailorStations(c).map(s => s.id).join(", ")}.`);
    return null;
  }
  const out = { station: hit.entry.id };
  if (l.sub != null && l.sub !== "") {
    const sub = subById(hit.entry, String(l.sub).trim());
    if (!sub) {
      errors.push(`${tag}: Abschnitt "${l.sub}" gibt es bei "${hit.entry.id}" nicht. Verfügbar sind: ${tailorSubIds(hit.entry).join(", ") || "keine Abschnitte"}.`);
      return null;
    }
    out.sub = sub.id;
  }
  if (!hasDetail(hit.entry)) warnings.push(`${tag}: Die Station "${hit.entry.title}" hat keine Detailseite.`);
  return out;
}

/* Firmenblock des Pakets. Prüft Name, Passwort (Format, nicht vergeben) und Farbe. */
function tailorCleanCompany(co, errors, warnings) {
  if (co == null) { errors.push("company fehlt: Für eine neue Bewerbung braucht das Paket den Block company mit dem Firmennamen."); return null; }
  if (typeof co !== "object" || Array.isArray(co)) { errors.push('company muss ein Objekt sein, zum Beispiel {"name": "Firma AG"}.'); return null; }
  Object.keys(co).forEach(k => { if (!["name", "password", "accent", "accent2"].includes(k)) warnings.push(`company: Unbekanntes Feld "${k}" wird ignoriert.`); });
  const L = TAILOR_LIMITS;
  const out = { name: tcleanStr(co.name, L.name, "company.name", errors, true), password: "", accent: "", accent2: "" };
  if (out.name.indexOf("\n") >= 0) { errors.push("company.name darf keinen Zeilenumbruch enthalten."); }
  if (co.password != null && co.password !== "") {
    if (typeof co.password !== "string") errors.push("company.password muss Text sein.");
    else {
      const pw = co.password.trim();
      if (/\s/.test(pw)) errors.push("company.password darf keine Leerzeichen enthalten.");
      else if (pw.length < L.pw[0] || pw.length > L.pw[1]) errors.push(`company.password muss ${L.pw[0]} bis ${L.pw[1]} Zeichen lang sein (hier ${pw.length}).`);
      else {
        if (pw !== pw.toLowerCase()) warnings.push("company.password enthält Großbuchstaben. Beim Login zählt die Schreibweise, auf dem Handy wird oft klein geschrieben.");
        const taken = Object.values(STATE.companies || {}).find(x => x && x.password === pw);
        if (taken) errors.push(`company.password ist schon an "${taken.name}" vergeben. Bitte ein anderes wählen oder das Feld weglassen (dann erzeuge ich beim Anlegen eines).`);
        out.password = pw;
      }
    }
  }
  if (co.accent != null && co.accent !== "") {
    const h = safeHex(co.accent);
    if (!h) errors.push('company.accent muss eine Farbe im Format #rrggbb sein, zum Beispiel "#d5001c".');
    else out.accent = h;
  }
  if (co.accent2 != null && co.accent2 !== "") {
    const h2 = safeHex(co.accent2);
    if (!h2) errors.push('company.accent2 muss eine Farbe im Format #rrggbb sein, zum Beispiel "#ec6500".');
    else if (!out.accent) warnings.push("company.accent2 braucht eine Hauptfarbe (company.accent) und wird sonst ignoriert.");
    else if (h2 === out.accent) warnings.push("company.accent2 ist dieselbe Farbe wie accent, es gibt keinen Verlauf.");
    else out.accent2 = h2;
  }
  if (out.name) {
    const same = Object.values(STATE.companies || {}).find(x => x && tailorNormName(x.name) === tailorNormName(out.name));
    if (same) warnings.push(`Es gibt schon eine Firma "${same.name}". Es wird trotzdem eine neue Bewerbung mit eigenem Passwort angelegt.`);
  }
  return out;
}

/* opts.mode: "existing" (Standard, Zuschnitt für eine vorhandene Firma), "new" (Paket mit company-Block), "load" (stilles Laden) */
function validateTailor(raw, c, opts) {
  const mode = (opts && opts.mode) || "existing";
  const errors = [], warnings = [];
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) {
    return { errors: ["Der Zuschnitt muss ein JSON-Objekt sein (beginnt mit { und endet mit })."], warnings, clean: null, company: null, hasTailor: false };
  }
  Object.keys(raw).forEach(k => { if (!["v", "role", "intro", "matches", "highlight", "company"].includes(k)) warnings.push(`Unbekanntes Feld "${k}" wird ignoriert.`); });
  let company = null;
  if (mode === "new") company = tailorCleanCompany(raw.company, errors, warnings);
  else if (mode === "existing" && raw.company != null) warnings.push('Der Block company wird ignoriert, weil die Firma schon existiert. Zum Anlegen oben "Neue Bewerbung anlegen" wählen.');
  const L = TAILOR_LIMITS;
  const clean = {
    v: 1,
    role: tcleanStr(raw.role, L.role, "Stelle (role)", errors, false),
    intro: tcleanStr(raw.intro, L.intro, "Einleitung (intro)", errors, false),
    matches: [],
    highlight: { stations: [], subs: [], skills: [] }
  };

  let ms = raw.matches == null ? [] : raw.matches;
  if (!Array.isArray(ms)) { errors.push("matches muss eine Liste sein."); ms = []; }
  if (ms.length > L.matches) errors.push(`Zu viele Passungen (${ms.length}), höchstens ${L.matches}.`);
  ms.slice(0, L.matches).forEach((m, i) => {
    const tag = `Passung ${i + 1}`;
    if (!m || typeof m !== "object" || Array.isArray(m)) { errors.push(`${tag}: muss ein Objekt mit requirement, answer und link sein.`); return; }
    Object.keys(m).forEach(k => { if (!["requirement", "answer", "link"].includes(k)) warnings.push(`${tag}: Unbekanntes Feld "${k}" wird ignoriert.`); });
    const out = {
      requirement: tcleanStr(m.requirement, L.req, `${tag}: requirement`, errors, true),
      answer: tcleanStr(m.answer, L.ans, `${tag}: answer`, errors, true)
    };
    const link = tailorCleanLink(m.link, c, tag, errors, warnings);
    if (link) out.link = link;
    else if (m.link == null) warnings.push(`${tag} hat keinen Link und ist deshalb nicht anklickbar.`);
    clean.matches.push(out);
  });
  if (clean.matches.length && (clean.matches.length < 3 || clean.matches.length > 5)) {
    warnings.push(`Empfohlen sind 3 bis 5 Passungen, hier sind es ${clean.matches.length}.`);
  }

  const h = raw.highlight == null ? {} : raw.highlight;
  if (typeof h !== "object" || Array.isArray(h)) {
    errors.push("highlight muss ein Objekt mit stations, subs und skills sein.");
  } else {
    Object.keys(h).forEach(k => { if (!["stations", "subs", "skills"].includes(k)) warnings.push(`highlight: Unbekanntes Feld "${k}" wird ignoriert.`); });
    const arr = (k) => {
      const v = h[k];
      if (v == null) return [];
      if (!Array.isArray(v)) { errors.push(`highlight.${k} muss eine Liste sein.`); return []; }
      if (v.length > L.list) errors.push(`highlight.${k} hat zu viele Einträge (${v.length}, höchstens ${L.list}).`);
      return v.slice(0, L.list);
    };
    arr("stations").forEach(id => {
      const hit = entryById(c, String(id).trim());
      if (!hit) errors.push(`highlight.stations: Station "${id}" gibt es nicht. Verfügbar sind: ${tailorStations(c).map(s => s.id).join(", ")}.`);
      else if (!clean.highlight.stations.includes(hit.entry.id)) clean.highlight.stations.push(hit.entry.id);
    });
    arr("subs").forEach(p => {
      const parts = String(p).split("/").map(x => x.trim());
      const hit = parts.length === 2 ? entryById(c, parts[0]) : null;
      const sub = hit ? subById(hit.entry, parts[1]) : null;
      if (!sub) errors.push(`highlight.subs: "${p}" ist keine gültige Angabe. Format: station/abschnitt, zum Beispiel h2/sim.`);
      else if (!clean.highlight.subs.includes(hit.entry.id + "/" + sub.id)) clean.highlight.subs.push(hit.entry.id + "/" + sub.id);
    });
    arr("skills").forEach(nm => {
      const f = tailorFindSkill(c, nm);
      if (!f) errors.push(`highlight.skills: Kenntnis "${nm}" gibt es nicht. Verfügbar sind: ${tailorSkillNames(c).join(", ")}.`);
      else if (!clean.highlight.skills.includes(f)) clean.highlight.skills.push(f);
    });
  }
  const hasTailor = !!(clean.role || clean.intro || clean.matches.length);
  if (!hasTailor) {
    if (mode === "new") warnings.push("Das Paket enthält nur die Firma, aber keinen Zuschnitt. Die Seite bleibt für diese Bewerbung unverändert (nur Farbe).");
    else warnings.push("Der Zuschnitt enthält weder Stelle, Einleitung noch Passungen und würde nichts anzeigen.");
  }
  return { errors, warnings, clean, company, hasTailor };
}

/* ---------- Relevanz (Stufe 2) ---------- */
function tailorCanonSkill(name) {
  const r = resolveSkill(name);
  return r ? r.key : String(name);
}
function tailorRelFrom(t) {
  const rel = { stations: new Set(), subs: new Set(), skills: new Set(), active: false };
  if (!t || !STATE.content) return rel;
  const c = STATE.content;
  const addSt = (id) => { const hit = entryById(c, id); if (hit) rel.stations.add(hit.entry.id); };
  const addSub = (id, sub) => {
    const hit = entryById(c, id);
    if (!hit) return;
    rel.stations.add(hit.entry.id);
    const s = subById(hit.entry, sub);
    if (s) rel.subs.add(hit.entry.id + "/" + s.id);
  };
  (t.matches || []).forEach(m => {
    const l = m && m.link;
    if (!l) return;
    if (l.station) { if (l.sub) addSub(l.station, l.sub); else addSt(l.station); }
    if (l.skill) rel.skills.add(tailorCanonSkill(l.skill));
  });
  const h = t.highlight || {};
  (h.stations || []).forEach(addSt);
  (h.subs || []).forEach(p => { const a = String(p).split("/"); addSub(a[0], a[1]); });
  (h.skills || []).forEach(n => rel.skills.add(tailorCanonSkill(n)));
  rel.active = rel.stations.size > 0 || rel.skills.size > 0;
  return rel;
}
function tailorRel(code) {
  return tailorRelFrom(STATE.tailor && STATE.tailor[code]);
}
function tailorSkillRel(item, rel) {
  return !!(rel && rel.skills.size && rel.skills.has(tailorCanonSkill(item)));
}
function tailorSortSkills(items, rel) {
  const list = (items || []).slice();
  if (!rel || !rel.skills.size) return list;
  return list.filter(it => tailorSkillRel(it, rel)).concat(list.filter(it => !tailorSkillRel(it, rel)));
}

/* ---------- Anzeige: Startseite ---------- */
function tailorTarget(m) {
  const c = STATE.content;
  const l = m && m.link;
  if (!l || !c) return null;
  if (l.skill) {
    const r = resolveSkill(l.skill);
    if (!r || !skillLinked(l.skill)) return null;
    return { kind: "skill", name: r.key, label: skillTitle(r.key) };
  }
  if (l.station) {
    const hit = entryById(c, l.station);
    if (!hit) return null;
    const sub = l.sub ? subById(hit.entry, l.sub) : null;
    return { kind: "station", key: hit.key, index: hit.index, sub: sub ? sub.id : undefined,
      label: (hit.entry.title || "Station") + (sub && sub.title ? " › " + sub.title : "") };
  }
  return null;
}

function renderTailorBlock(code, rel) {
  const t = STATE.tailor && STATE.tailor[code];
  if (!t) return "";
  const role = String(t.role || "").trim();
  const intro = String(t.intro || "").trim();
  const ms = (t.matches || []).filter(m => m && m.requirement && m.answer);
  if (!role && !intro && !ms.length) return "";
  const head = role ? "Bewerbung als " + role : "Passung zur Stelle";
  const items = ms.map((m, i) => {
    const tg = tailorTarget(m);
    return `
      <div class="match">
        <div class="match-req">${escapeHtml(m.requirement)}</div>
        <div class="match-ans">${escapeHtml(m.answer)}</div>
        ${tg ? `<button class="sk-go match-go" data-match="${i}"><span class="lbl">Mehr dazu: ${escapeHtml(tg.label)}</span>&nbsp;${ICON_ARROW}</button>` : ""}
      </div>`;
  }).join("");
  return `
    <section class="tailor" id="tailor-block">
      <div class="sec-head"><span class="bar"></span><h2>${escapeHtml(head)}</h2></div>
      <div class="tailor-body">
        ${intro ? `<div class="tailor-intro">${escapeHtml(intro)}</div>` : ""}
        ${ms.length ? `${role ? `<div class="tailor-sub">Passung zur Stelle</div>` : ""}<div class="matches">${items}</div>` : ""}
        ${rel && rel.active ? `<div class="tailor-hint">Passende Stationen und Kenntnisse sind unten markiert beziehungsweise fett gesetzt.</div>` : ""}
      </div>
    </section>`;
}

function attachTailorHandlers(code) {
  document.querySelectorAll(".match-go").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.getAttribute("data-match"), 10);
      const t = STATE.tailor && STATE.tailor[code];
      const ms = t ? (t.matches || []).filter(m => m && m.requirement && m.answer) : [];
      const tg = ms[i] ? tailorTarget(ms[i]) : null;
      if (!tg) return;
      if (!STATE.isAdminAuthed) trackVisit(code, "match:" + i);   // Vorschau aus dem Admin zählt nicht
      if (tg.kind === "skill") openSkill(code, tg.name);
      else openEntry(code, tg.key, tg.index, tg.sub);
    });
  });
}

/* ---------- Admin: Zuschnitt einfügen, prüfen, speichern ---------- */
function tailorPretty(t) { return JSON.stringify(t, null, 2); }

function tailorTemplate(isNew) {
  const t = {};
  if (isNew) t.company = { name: "Firmenname", password: genPassword(), accent: "#1f4e8c" };
  t.role = "Werkstudent Brennstoffzellenentwicklung (m/w/d)";
  t.intro = "Zwei bis vier Sätze, warum genau diese Stelle.";
  t.matches = [
    { requirement: "Anforderung aus der Anzeige", answer: "Kurze Antwort mit Beleg.", link: { station: "h2", sub: "sim" } },
    { requirement: "Noch eine Anforderung", answer: "Kurze Antwort.", link: { skill: "Python" } }
  ];
  t.highlight = { stations: [], subs: [], skills: [] };
  return tailorPretty(t);
}

function tailorReference(c) {
  const rows = tailorStations(c).map(s =>
    `<tr><td><code>${escapeHtml(s.id)}</code></td><td>${escapeHtml(s.title)}${s.id === "fasttube-projekt" ? " (Duplikat von fasttube, bitte nicht verwenden)" : ""}</td><td>${tailorSubIds(s.entry).map(x => `<code>${escapeHtml(x)}</code>`).join(" ") || "–"}</td></tr>`).join("");
  const sk = tailorSkillNames(c).filter(skillLinked).map(n => `<code>${escapeHtml(n)}</code>`).join(" ");
  return `
    <details class="tailor-ref"><summary>Mögliche Verweise anzeigen</summary>
      <div class="tbl-scroll"><table class="simple"><thead><tr><th>station</th><th>Titel</th><th>sub (Abschnitte)</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="small-note" style="margin-top:10px"><b>skill</b> (mit eigener Seite): ${sk}</div>
    </details>`;
}

function tailorSwatch(hex, hex2) {
  const bg = swatchBg(hex, hex2);
  return bg ? `<span class="swatch" style="background:${bg}"></span>` : "";
}

function tailorReportHtml(res, c) {
  if (!res) return "";
  const li = (arr) => `<ul class="cvlist">${arr.map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>`;
  let out = "";
  if (res.parseError) return `<div class="error-msg">${escapeHtml(res.parseError)}</div>`;
  if (res.errors.length) out += `<div class="error-msg"><b>Nicht gespeichert, bitte korrigieren:</b>${li(res.errors)}</div>`;
  if (res.created) {
    const k = res.created;
    out += `<div class="tailor-created"><b>Bewerbung angelegt.</b>
      <div>Firma: ${tailorSwatch(k.accent, k.accent2)}${escapeHtml(k.name)}${k.accent2 ? " (Farbverlauf)" : ""}</div>
      <div class="pw-line">Passwort: <code class="pw-big" id="tailor-created-pw">${escapeHtml(k.password)}</code>
        <button class="icon-btn" data-action="tailor-copy-pw" data-pw="${escapeHtml(k.password)}">Passwort kopieren</button></div>

  }
  if (res.warnings.length) out += `<div class="tailor-warn"><b>Hinweise</b>${li(res.warnings)}</div>`;
  if (!res.errors.length && res.clean && !(res.company && !res.hasTailor)) {
    const rel = tailorRelFrom(res.clean);
    const st = tailorStations(c);
    const stNames = [...rel.stations].map(id => (st.find(s => s.id === id) || {}).title || id);
    const subNames = [...rel.subs].map(p => {
      const a = p.split("/"); const hit = entryById(c, a[0]); const s = hit ? subById(hit.entry, a[1]) : null;
      return (hit ? hit.entry.title : a[0]) + " / " + (s ? s.title : a[1]);
    });
    const links = res.clean.matches.map((m, i) => {
      const tg = tailorTarget(m);

    });

      ${res.company && !res.created ? `<div>Neue Firma: ${tailorSwatch(res.company.accent, res.company.accent2)}${escapeHtml(res.company.name)}${res.company.accent ? (res.company.accent2 ? " (Farbverlauf)" : "") : " (Standardfarben)"}</div>
      <div>Passwort: ${res.company.password ? `<code>${escapeHtml(res.company.password)}</code>` : "wird beim Anlegen erzeugt"}</div>` : ""}
      ${res.clean.role ? `<div>Stelle: ${escapeHtml(res.clean.role)}</div>` : ""}
      ${links.length ? `<div>Passungen:</div>${li(links)}` : ""}
      <div>Markierte Stationen: ${escapeHtml(stNames.join(", ") || "keine")}</div>
      <div>Vorgezogene Abschnitte: ${escapeHtml(subNames.join(", ") || "keine")}</div>
      <div>Hervorgehobene Kenntnisse: ${escapeHtml([...rel.skills].join(", ") || "keine")}</div>
    </div>`;
  } else if (!res.errors.length && res.company && !res.created) {
    out += `<div class="tailor-ok"><b>Gültig.</b>
      <div>Neue Firma: ${tailorSwatch(res.company.accent, res.company.accent2)}${escapeHtml(res.company.name)}${res.company.accent ? (res.company.accent2 ? " (Farbverlauf)" : "") : " (Standardfarben)"}</div>
      <div>Passwort: ${res.company.password ? `<code>${escapeHtml(res.company.password)}</code>` : "wird beim Anlegen erzeugt"}</div>
    </div>`;
  }
  return out;
}
