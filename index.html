function tailorParse(text) {
  let t = String(text || "").trim();
  t = t.replace(/^```[a-z]*\s*/i, "").replace(/\s*```$/, "").trim();      // Codeblock aus dem Chat mitkopiert
  if (!t) return { parseError: "Das Feld ist leer." };
  try { return { value: JSON.parse(t) }; }
  catch (e) { return { parseError: "Das ist kein gültiges JSON: " + e.message }; }
}

function tailorRunCheck(code) {
  const p = tailorParse(STATE.tailorDraft[code]);
  if (p.parseError) return { parseError: p.parseError, errors: [p.parseError], warnings: [], clean: null, company: null, hasTailor: false };
  return validateTailor(p.value, STATE.content, { mode: code === TAILOR_NEW ? "new" : "existing" });
}

async function tailorSelect(code) {
  STATE.tailorSel = code || "";
  STATE.tailorDraft = STATE.tailorDraft || {};
  STATE.tailorReport = null;
  if (code && code !== TAILOR_NEW) {
    const t = await loadTailor(code);
    if (STATE.tailorDraft[code] == null) STATE.tailorDraft[code] = t ? tailorPretty(t) : "";
  }
  render();
  if (code) { const el = document.getElementById("tailor-panel"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "start" }); }
}

/* Neue Bewerbung aus dem Paket: Zuschnitt, Firma, Passwort und Farbe in einem Schritt.
   Die Firmenliste wird dafür frisch geladen, damit kein Passwort doppelt vergeben wird. */
async function tailorCreate() {
  if (STATE.tailorBusy) return;
  STATE.tailorBusy = true;
  try {
    const res = tailorRunCheck(TAILOR_NEW);
    const fail = (msg) => { STATE.tailorReport = { code: TAILOR_NEW, res: { errors: [msg], warnings: [], clean: null, company: null, hasTailor: false } }; render(); };
    if (res.errors.length || !res.clean || !res.company) { STATE.tailorReport = { code: TAILOR_NEW, res }; render(); return; }
    const fresh = await loadCompanies();
    const used = new Set(Object.values(fresh).map(x => x && x.password));
    let password = res.company.password;
    if (password && used.has(password)) { fail("company.password ist inzwischen vergeben. Bitte ein anderes wählen oder das Feld weglassen."); return; }
    if (!password) { do { password = genPassword(); } while (used.has(password)); }
    let code;
    do { code = genCode(8); } while (fresh[code]);
    const entry = { name: res.company.name, password, createdAt: Date.now(), opened: false, openedAt: null, pagesVisited: {} };
    if (DEFAULT_VALID_DAYS > 0) entry.expiresAt = expiryFromDays(DEFAULT_VALID_DAYS);
    if (res.company.accent) entry.accent = res.company.accent;
    if (res.company.accent2) entry.accent2 = res.company.accent2;
    if (res.hasTailor) {
      const okT = await storageSet(TAILOR_PREFIX + code, JSON.stringify(res.clean));
      if (!okT) { fail("Speichern hat nicht geklappt. Es wurde nichts angelegt. Bitte erneut versuchen."); return; }
      entry.tailored = { role: res.clean.role, reqs: res.clean.matches.map(m => m.requirement), at: Date.now() };
    }
    fresh[code] = entry;
    const okC = await saveCompanies(fresh);
    if (!okC) {
      if (res.hasTailor) await storageSet(TAILOR_PREFIX + code, "");
      fail("Speichern hat nicht geklappt. Es wurde nichts angelegt. Bitte erneut versuchen.");
      return;
    }
    STATE.companies = fresh;
    STATE.tailor = STATE.tailor || {};
    STATE.tailor[code] = res.hasTailor ? res.clean : null;
    STATE.tailorDraft[code] = res.hasTailor ? tailorPretty(res.clean) : "";
    STATE.tailorDraft[TAILOR_NEW] = "";
    STATE.tailorSel = code;
    STATE.tailorReport = { code, res: Object.assign({}, res, { saved: res.hasTailor, created: { code, name: entry.name, password, accent: entry.accent || "", accent2: entry.accent2 || "" } }) };
    render();
    showToast(`Passwort für ${entry.name} erstellt: ${password}` + (entry.expiresAt ? ` (gültig bis ${fmtDay(entry.expiresAt)})` : ""));
  } finally {
    STATE.tailorBusy = false;
  }
}

/* ---------- Fotos: Speicherung in Firestore (cv_app/photo_<id>) ----------
   photos[] eines Eintrags darf enthalten:
     ""            -> leerer Platzhalter (nur im Admin sichtbar)
     "fs:<id>"     -> hochgeladenes Foto, liegt in Firestore
     "https://..." -> externes Bild oder relativer Pfad (z. B. images/foto1.jpg)
*/
const PHOTO_PREFIX = "photo_";
const PHOTO_MAX_EDGE = 1400;          // längste Kante in Pixeln
const PHOTO_MAX_CHARS = 850000;       // Firestore-Dokument darf < 1 MiB sein
const PHOTO_BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
const PHOTO_CACHE = {};
const PHOTO_PENDING = {};

function isRealPhoto(p) { return typeof p === "string" && p.trim() !== ""; }

function photoImgTag(ref, alt) {
  const safeAlt = escapeHtml(alt);
  if (ref.startsWith("fs:")) {
    const id = ref.slice(3);
    const cached = PHOTO_CACHE[id];
    return cached
      ? `<img src="${cached}" alt="${safeAlt}" data-fs="${escapeHtml(id)}">`
      : `<img class="loading" src="${PHOTO_BLANK}" alt="${safeAlt}" data-fs="${escapeHtml(id)}">`;
  }
  return `<img src="${escapeHtml(ref)}" alt="${safeAlt}" loading="lazy">`;
}

async function loadPhoto(id) {
  if (PHOTO_CACHE[id]) return PHOTO_CACHE[id];
  if (!PHOTO_PENDING[id]) {
    PHOTO_PENDING[id] = storageGet(PHOTO_PREFIX + id).then(v => {
      if (v) PHOTO_CACHE[id] = v;
      delete PHOTO_PENDING[id];
      return v;
    });
  }
  return PHOTO_PENDING[id];
}

function hydratePhotos() {
  document.querySelectorAll("img[data-fs]").forEach(async (img) => {
    const src = await loadPhoto(img.getAttribute("data-fs"));
    if (!img.isConnected) return;
    if (src) { img.src = src; img.classList.remove("loading"); }
    else { img.alt = "Bild nicht verfügbar"; }
  });
}

function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Format nicht lesbar (z. B. HEIC bitte vorher in JPG umwandeln)")); };
    img.src = url;
  });
}

async function resizeImage(file) {
  const img = await fileToImage(file);
  const W = img.naturalWidth, H = img.naturalHeight;
  if (!W || !H) throw new Error("Bild ist leer");
  let edge = PHOTO_MAX_EDGE;
  for (let attempt = 0; attempt < 6; attempt++) {
    const scale = Math.min(1, edge / Math.max(W, H));
    const w = Math.max(1, Math.round(W * scale)), h = Math.max(1, Math.round(H * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    for (const q of [0.85, 0.75, 0.65, 0.55]) {
      const out = canvas.toDataURL("image/jpeg", q);
      if (out.length <= PHOTO_MAX_CHARS) return out;
    }
    edge = Math.round(edge * 0.8);
  }
  throw new Error("Bild lässt sich nicht klein genug rechnen");
}

const ADMIN_FIELD_SELECTOR = "[data-entry-field],[data-section-field],[data-field],[data-skill-field],[data-sp-field]";

  if (!STATE.content) return;

// Übernimmt die aktuellen Eingaben der Einträge aus dem DOM in STATE (ohne zu speichern)
function syncEntryFields(key) {
  document.querySelectorAll(`[data-entry-field][data-key="${key}"]`).forEach(input => {
    const idx = parseInt(input.getAttribute("data-index"), 10);
    const field = input.getAttribute("data-entry-field");
    const entry = STATE.content[key][idx];
    if (!entry) return;
    if (field === "bullets") {
      entry.bullets = input.value.split("\n").map(s => s.trim()).filter(Boolean);
    } else {
      entry[field] = input.value;
    }
  });
  document.querySelectorAll(`[data-section-field][data-key="${key}"]`).forEach(input => {
    const idx = parseInt(input.getAttribute("data-index"), 10);
    const sidx = parseInt(input.getAttribute("data-sindex"), 10);
    const field = input.getAttribute("data-section-field");
    const entry = STATE.content[key][idx];
    if (!entry || !Array.isArray(entry.sections) || !entry.sections[sidx]) return;
    entry.sections[sidx][field] = field === "bullets"
      ? input.value.split("\n").map(s => s.trim()).filter(Boolean)
      : input.value;
  });
}

function attachAdminHandlers() {
  attachSkillAdminHandlers();
  attachTailorAdminHandlers();
  attachAdminNavHandlers();
  attachAccessHandlers();
  document.querySelectorAll('[data-action="stats-open"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      STATE.statsSel = btn.getAttribute("data-code");
      await openStats();
    });
  });
  const _uc = document.getElementById("new-company-usecolor");
  const _cc = document.getElementById("new-company-color");
  if (_uc && _cc) _cc.addEventListener("input", () => { _uc.checked = true; });

  document.querySelectorAll('[data-action="company-color"]').forEach(inp => {
    inp.addEventListener("change", async () => {
      await updateCompanyAccentAndRefresh(inp.getAttribute("data-code"), inp.value, "Firmenfarbe gespeichert.");
    });
  });
  document.querySelectorAll('[data-action="company-color-reset"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      await updateCompanyAccentAndRefresh(btn.getAttribute("data-code"), "", "Standardfarben aktiv.");
    });
  });
  document.querySelectorAll('[data-action="preview"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const cd = btn.getAttribute("data-code");
      await loadTailor(cd);
      setRoute({ view: "home", code: cd });
    });
  });

  const logout = document.getElementById("admin-logout");
  if (logout) logout.addEventListener("click", (e) => { e.preventDefault(); STATE.isAdminAuthed = false; setRoute({ view: "login" }); });

  const createBtn = document.getElementById("create-company-btn");
  if (createBtn) {
    createBtn.addEventListener("click", async () => {
      const nameInput = document.getElementById("new-company-name");
      const name = nameInput.value.trim();
      if (!name) { showToast("Bitte einen Firmennamen eingeben."); return; }
      const fresh = await loadCompaniesChecked();
      if (!fresh) { showToast("Anlegen nicht möglich: Die Bewerbungen konnten nicht geladen werden. Bitte erneut versuchen.", true); return; }
      let code;
      do { code = genCode(8); } while (fresh[code]);
      const used = new Set(Object.values(fresh).map(x => x && x.password));
      let password;
      do { password = genPassword(); } while (used.has(password));
      const days = parseInt((document.getElementById("new-company-valid") || {}).value, 10) || 0;
      fresh[code] = { name, password, createdAt: Date.now(), opened: false, openedAt: null, pagesVisited: {} };
      if (days > 0) fresh[code].expiresAt = expiryFromDays(days);
      const _useC = document.getElementById("new-company-usecolor");
      if (_useC && _useC.checked) fresh[code].accent = safeHex(document.getElementById("new-company-color").value);
      const okNew = await saveCompanies(fresh);
      if (!okNew) { showToast("Speichern fehlgeschlagen – die Bewerbung wurde NICHT angelegt.", true); return; }
      STATE.companies = fresh;
      nameInput.value = "";
      render();
      showToast(`Passwort für ${name} erstellt: ${password}` + (days > 0 ? ` (gültig bis ${fmtDay(fresh[code].expiresAt)})` : " (unbegrenzt gültig)"));
    });
  }

  document.querySelectorAll('[data-action="copy"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const code = btn.getAttribute("data-code");
      const company = STATE.companies[code];
      const text = `Passwort: ${company.password}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast("Passwort kopiert."));
      } else {
        showToast(text);
      }
    });
  });

  document.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const code = btn.getAttribute("data-code");
      if (!confirm(`Eintrag für "${STATE.companies[code].name}" wirklich löschen?\n\nDamit gehen auch Tracking und Auswertung dieser Bewerbung verloren. Zum bloßen Deaktivieren besser „Sperren“ nutzen.`)) return;
      const fresh = await loadCompaniesChecked();
      if (!fresh) { showToast("Löschen nicht möglich: Die Bewerbungen konnten nicht geladen werden.", true); return; }
      delete fresh[code];
      const okDel = await saveCompanies(fresh);
      if (!okDel) { showToast("Speichern fehlgeschlagen – der Eintrag wurde NICHT gelöscht.", true); return; }
      STATE.companies = fresh;
      try { await storageSet(TAILOR_PREFIX + code, ""); if (STATE.tailor) delete STATE.tailor[code]; } catch (e) {}
      try { const { doc, deleteDoc, db } = window.__fb; await deleteDoc(doc(db, FS_COLLECTION, EVENTS_PREFIX + code)); } catch (e) {}
      if (STATE.events) delete STATE.events[code];
      render();
    });
  });

  const saveProfileBtn = document.getElementById("save-profile-btn");
  if (saveProfileBtn) {
    saveProfileBtn.addEventListener("click", async () => {
      document.querySelectorAll("[data-field]").forEach(input => {
        const field = input.getAttribute("data-field");
        STATE.content[field] = input.value;
      });
      await persistContent("Profil gespeichert.");
    });
  }

  document.querySelectorAll('[data-action="add-entry"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.getAttribute("data-key");
      STATE.content[key].push({ when: "", title: "", org: "", story: "", photos: [], bullets: [], sections: [] });
      render();
    });
  });

  document.querySelectorAll('[data-action="add-section"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.getAttribute("data-key");
      const idx = parseInt(btn.getAttribute("data-index"), 10);
      syncEntryFields(key);
      const entry = STATE.content[key][idx];
      if (!entry) return;
      if (!Array.isArray(entry.sections)) entry.sections = [];
      entry.sections.push({ title: "", text: "", bullets: [] });
      render();
    });
  });

  document.querySelectorAll('[data-action="remove-section"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const key = btn.getAttribute("data-key");
      const idx = parseInt(btn.getAttribute("data-index"), 10);
      const sidx = parseInt(btn.getAttribute("data-sindex"), 10);
      syncEntryFields(key);
      const entry = STATE.content[key][idx];
      if (!entry || !Array.isArray(entry.sections)) return;
      entry.sections.splice(sidx, 1);
      await persistContent();
      render();
    });
  });

  document.querySelectorAll('[data-action="move-section"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const key = btn.getAttribute("data-key");
      const idx = parseInt(btn.getAttribute("data-index"), 10);
      const sidx = parseInt(btn.getAttribute("data-sindex"), 10);
      const dir = parseInt(btn.getAttribute("data-dir"), 10);
      syncEntryFields(key);
      const entry = STATE.content[key][idx];
      if (!entry || !Array.isArray(entry.sections)) return;
      const target = sidx + dir;
      if (target < 0 || target >= entry.sections.length) return;
      const tmp = entry.sections[sidx];
      entry.sections[sidx] = entry.sections[target];
      entry.sections[target] = tmp;
      await persistContent();
      render();
    });
  });

  document.querySelectorAll('[data-action="remove-entry"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const key = btn.getAttribute("data-key");
      const idx = parseInt(btn.getAttribute("data-index"), 10);
      STATE.content[key].splice(idx, 1);
      await persistContent();
      render();
    });
  });

  document.querySelectorAll('[data-action="save-entries"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const key = btn.getAttribute("data-key");
      syncEntryFields(key);
      await persistContent("Gespeichert.");
    });
  });

  document.querySelectorAll('[data-action="upload-photos"]').forEach(inp => {
    inp.addEventListener("change", async () => {
      const key = inp.getAttribute("data-key");
      const idx = parseInt(inp.getAttribute("data-index"), 10);
      const files = Array.from(inp.files || []);
      if (!files.length) return;
      syncEntryFields(key);
      const entry = STATE.content[key][idx];
      if (!entry) return;
      if (!Array.isArray(entry.photos)) entry.photos = [];
      const label = inp.parentElement.querySelector(".file-btn-text");
      let added = 0;
      const failed = [];
      for (let n = 0; n < files.length; n++) {
        const file = files[n];
        if (label) label.textContent = `Lade ${n + 1}/${files.length} …`;
        try {
          if (!file.type.startsWith("image/")) throw new Error("kein Bild");
          const dataUrl = await resizeImage(file);
          const id = genCode(10);
          const ok = await storageSet(PHOTO_PREFIX + id, dataUrl);
          if (!ok) throw new Error("Speichern in Firestore fehlgeschlagen");
          PHOTO_CACHE[id] = dataUrl;
          const ref = "fs:" + id;
          const empty = entry.photos.findIndex(p => !isRealPhoto(p));
          if (empty >= 0) entry.photos[empty] = ref; else entry.photos.push(ref);
          added++;
        } catch (err) {
          console.error("Foto-Upload", file.name, err);
          failed.push(`${file.name} (${err.message})`);
        }
      }
      const saved = added ? await persistContent() : true;
      render();
      if (saved) showToast(failed.length
        ? `${added} Foto(s) gespeichert. Fehler: ${failed.join("; ")}`
        : `${added} Foto(s) hochgeladen.`);
    });
  });

  document.querySelectorAll('[data-action="add-photo-url"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const key = btn.getAttribute("data-key");
      const idx = parseInt(btn.getAttribute("data-index"), 10);
      const field = document.querySelector(`[data-photo-url-input][data-key="${key}"][data-index="${idx}"]`);
      const url = field ? field.value.trim() : "";
      if (!url) { showToast("Bitte eine Bild-URL eingeben."); return; }
      syncEntryFields(key);
      const entry = STATE.content[key][idx];
      if (!entry) return;
      if (!Array.isArray(entry.photos)) entry.photos = [];
      const empty = entry.photos.findIndex(p => !isRealPhoto(p));
      if (empty >= 0) entry.photos[empty] = url; else entry.photos.push(url);
      const savedUrl = await persistContent();
      render();
      if (savedUrl) showToast("Foto hinzugefügt.");
    });
  });

  document.querySelectorAll('[data-action="remove-photo"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const key = btn.getAttribute("data-key");
      const idx = parseInt(btn.getAttribute("data-index"), 10);
      const pi = parseInt(btn.getAttribute("data-photo"), 10);
      syncEntryFields(key);
      const entry = STATE.content[key][idx];
      if (!entry || !Array.isArray(entry.photos)) return;
      const ref = entry.photos[pi];
      entry.photos.splice(pi, 1);
      await persistContent();
      if (typeof ref === "string" && ref.startsWith("fs:")) {
        const id = ref.slice(3);
        delete PHOTO_CACHE[id];
        try {
          const { doc, deleteDoc, db } = window.__fb;
          await deleteDoc(doc(db, FS_COLLECTION, PHOTO_PREFIX + id));
        } catch (e) { console.error("Foto löschen", e); }
      }
      render();
    });
  });

  document.querySelectorAll('[data-action="add-skillgroup"]').forEach(btn => {
    btn.addEventListener("click", () => {
      STATE.content.skillGroups.push({ label: "", items: [] });
      render();
    });
  });
  document.querySelectorAll('[data-action="remove-skillgroup"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      const idx = parseInt(btn.getAttribute("data-index"), 10);
      STATE.content.skillGroups.splice(idx, 1);
      await persistContent();
      render();
    });
  });
  document.querySelectorAll('[data-action="save-skillgroups"]').forEach(btn => {
    btn.addEventListener("click", async () => {
      document.querySelectorAll("[data-skill-field]").forEach(input => {
        const idx = parseInt(input.getAttribute("data-index"), 10);
        const field = input.getAttribute("data-skill-field");
        if (!STATE.content.skillGroups[idx]) return;
        if (field === "items") {
          STATE.content.skillGroups[idx].items = input.value.split(",").map(s => s.trim()).filter(Boolean);
        } else {
          STATE.content.skillGroups[idx][field] = input.value;
        }
      });
      await persistContent("Gespeichert.");
    });
  });

  const saveAdminPwBtn = document.getElementById("save-admin-pw-btn");
  if (saveAdminPwBtn) {
    saveAdminPwBtn.addEventListener("click", async () => {
      const input = document.getElementById("new-admin-pw");
      const val = input.value.trim();
      if (!val) { showToast("Bitte ein neues Passwort eingeben."); return; }
      if (val.length < 6) { showToast("Mindestens 6 Zeichen verwenden."); return; }
      STATE.adminPw = val;
      await saveAdminPw(val);
      input.value = "";
      showToast("Admin-Passwort geändert.");
    });
  }
}


/* ============================================================
   ADMIN: AUSWERTUNG (Logins, Klicks, Verlauf) + Gültigkeit/Sperren
   ============================================================ */
const EVENT_TAGS = { login: "Login", station: "Station", skill: "Kenntnis", match: "Passung", contact: "Kontakt", blocked: "Abgewiesen" };

function adminNav(active) {
  return `
      <div class="crumbs admin-nav">
        <span>Admin-Bereich</span>
        <a href="#" id="nav-admin" class="${active === "admin" ? "on" : ""}">Verwaltung</a>
        <a href="#" id="nav-stats" class="${active === "stats" ? "on" : ""}">Auswertung</a>
      </div>`;
}

function revokeButton(code, c) {
  return c.revokedAt
    ? `<button class="icon-btn" data-action="unrevoke" data-code="${escapeHtml(code)}">Freigeben</button>`
    : `<button class="icon-btn danger" data-action="revoke" data-code="${escapeHtml(code)}">Sperren</button>`;
}

async function loadStatsData() {
  const fresh = await loadCompaniesChecked();
  if (fresh) STATE.companies = fresh;
  const codes = Object.keys(STATE.companies || {});
  const lists = await Promise.all(codes.map(loadEvents));
  STATE.events = {};
  codes.forEach((cd, i) => { STATE.events[cd] = lists[i]; });
  STATE.statsLoadedAt = Date.now();
}
async function openStats() {
  await loadStatsData();
  setRoute({ view: "admin_stats" });
}

function companyStats(code, c) {
  const pv = c.pagesVisited || {};
  const ev = (STATE.events && STATE.events[code]) || [];
  const times = [c.lastLoginAt || 0, c.openedAt || 0];
  Object.values(pv).forEach(t => times.push(t || 0));
  ev.forEach(e => { if (e.t !== "blocked") times.push(e.at || 0); });
  return { pages: Object.keys(pv).length, last: Math.max.apply(null, times), ev };
}

function renderAdminStats() {
  if (!STATE.isAdminAuthed) return renderAdminLogin();
  const rows = Object.entries(STATE.companies || {}).map(([code, c]) => ({ code, c, s: companyStats(code, c) }))
    .sort((a, b) => (b.s.last ? 1 : 0) - (a.s.last ? 1 : 0) || b.s.last - a.s.last || (b.c.createdAt || 0) - (a.c.createdAt || 0));
  const total = rows.length;
  const opened = rows.filter(r => r.c.opened).length;
  const cnt = { active: 0, expired: 0, revoked: 0 };
  rows.forEach(r => { cnt[companyStatus(r.c)]++; });
  const latest = rows.find(r => r.s.last);
  if (!STATE.statsSel || !STATE.companies[STATE.statsSel]) STATE.statsSel = rows.length ? rows[0].code : null;

  const cards = `
    <div class="stat-cards">
      <div class="stat-card"><div class="n">${total}</div><div class="l">Bewerbungen</div></div>
      <div class="stat-card"><div class="n">${opened}<span class="of"> / ${total}</span></div><div class="l">Link geöffnet${total ? ` (${Math.round(opened / total * 100)} %)` : ""}</div></div>
      <div class="stat-card"><div class="n">${cnt.active}</div><div class="l">Zugänge aktiv · ${cnt.expired} abgelaufen · ${cnt.revoked} gesperrt</div></div>
      <div class="stat-card"><div class="n sm">${latest ? escapeHtml(latest.c.name) : "–"}</div><div class="l">Zuletzt aktiv${latest ? ": " + fmtDate(latest.s.last) : ""}</div></div>
    </div>`;

  const tableRows = rows.map(({ code, c, s }) => `
      <tr class="${code === STATE.statsSel ? "sel" : ""}">
        <td>${safeHex(c.accent) ? `<span class="swatch" style="background:${swatchBg(c.accent, c.accent2)}"></span>` : ""}<b>${escapeHtml(c.name)}</b>${c.tailored ? `<div class="tailor-pill">${escapeHtml(c.tailored.role || "Zuschnitt")}</div>` : ""}</td>
        <td>${accessPill(c)}<div class="small-note" style="margin:3px 0 0">${escapeHtml(validityNote(c))}</div></td>
        <td>${c.opened ? fmtDate(c.openedAt) : `<span class="pill pending">nicht geöffnet</span>`}</td>
        <td>${c.logins ? c.logins : (c.opened ? "≥ 1" : "0")}</td>
        <td>${s.last ? fmtDate(s.last) : "–"}</td>
        <td>${s.pages}</td>
        <td>${c.blocked ? `${c.blocked}<div class="small-note" style="margin:0">zuletzt ${fmtDate(c.lastBlockedAt)}</div>` : "0"}</td>
        <td><button class="icon-btn" data-action="stats-select" data-code="${escapeHtml(code)}">Verlauf</button></td>
      </tr>`).join("");

  // Beliebteste Seiten über alle Bewerbungen (nur Stationen/Kenntnisse, Passungen sind je Bewerbung individuell)
  const agg = {};
  rows.forEach(({ code, c }) => Object.keys(c.pagesVisited || {}).forEach(k => {
    if (k.indexOf("match:") === 0) return;
    (agg[k] = agg[k] || { n: 0, code }).n++;
  }));
  const popular = Object.entries(agg).sort((a, b) => b[1].n - a[1].n).slice(0, 10)
    .map(([k, v]) => `<tr><td>${escapeHtml(visitedLabel(k, v.code))}</td><td>${v.n} von ${opened}</td></tr>`).join("");

  return `
  <div class="app admin-shell wide">
    <div class="topbar">
      ${adminNav("stats")}
      <div class="session"><a id="admin-logout" href="#" style="color:inherit;">Abmelden</a></div>
    </div>

    <div class="stat-head">
      <button class="btn ghost" id="stats-refresh">Aktualisieren</button>
      <span class="small-note" style="margin:0">Stand ${STATE.statsLoadedAt ? fmtDate(STATE.statsLoadedAt) : "–"}</span>
    </div>
    ${cards}

    <div class="panel">
      <h2>Auswertung pro Bewerbung</h2>
      ${tableRows ? `<div class="table-scroll"><table class="simple">
        <thead><tr><th>Firma</th><th>Zugang</th><th>Erster Aufruf</th><th>Logins</th><th>Zuletzt aktiv</th><th>Seiten</th><th>Abgewiesen</th><th></th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table></div>` : `<div class="empty-note">Noch keine Bewerbungen angelegt.</div>`}
    </div>

    ${STATE.statsSel ? renderStatsDetail(STATE.statsSel) : ""}

    <div class="panel">
      <h2>Was wird am häufigsten angesehen?</h2>
      ${popular ? `<table class="simple"><thead><tr><th>Seite</th><th>Bewerbungen, die sie angesehen haben</th></tr></thead><tbody>${popular}</tbody></table>` : `<div class="empty-note">Noch keine Seitenaufrufe.</div>`}
    </div>

    <div class="panel">
      <h2>So wird gezählt</h2>
      <div class="small-note" style="margin:0">
        Mitgeschrieben werden Logins, geöffnete Stationen, Kenntnisse, Passungen und Klicks auf Telefon, E-Mail und LinkedIn – nur bei Besuchen mit Passwort, nicht in der Admin-Vorschau. Ein Login entspricht einem Seitenaufruf mit Passworteingabe (nach Neuladen also ein neuer Login). Einzelne Klicks im Verlauf gibt es erst seit Einführung der Auswertung (max. ${EVENT_CAP} je Bewerbung); davor ist nur der letzte Aufruf je Seite bekannt.<br>
        „Gesperrt“ und „Abgelaufen“ verhindern das Öffnen der Seite mit dem Passwort und werden bei jedem Klick geprüft. Das ist eine Zugangsschranke, kein technischer Schutz der Inhalte.
      </div>
    </div>
  </div>`;
}

function renderStatsDetail(code) {
  const c = STATE.companies[code];
  if (!c) return "";
  const s = companyStats(code, c);
  const ev = s.ev.slice().sort((a, b) => (b.at || 0) - (a.at || 0));
  const countFor = (k) => ev.filter(e => e.k === k && (e.t === "station" || e.t === "skill" || e.t === "match")).length;
  const pages = Object.entries(c.pagesVisited || {}).sort((a, b) => (b[1] || 0) - (a[1] || 0));
  const pageRows = pages.map(([k, t]) => {
    const n = countFor(k);
    return `<tr><td>${escapeHtml(visitedLabel(k, code))}</td><td>${fmtDate(t)}</td><td>${n || "–"}</td></tr>`;
  }).join("");
  const evRows = ev.map(e => `<tr><td style="white-space:nowrap">${fmtDate(e.at)}</td><td><span class="tag t-${escapeHtml(e.t)}">${escapeHtml(EVENT_TAGS[e.t] || e.t)}</span></td><td>${escapeHtml(e.l || "")}</td></tr>`).join("");
  const cd = escapeHtml(code);
  return `
    <div class="panel" id="stats-detail">
      <h2>${escapeHtml(c.name)} <span style="font-size:14px;font-weight:400;color:var(--soft)">· Passwort <code>${escapeHtml(c.password)}</code></span></h2>
      <div style="margin-bottom:12px">${accessPill(c)} <span class="small-note" style="margin:0 0 0 6px">${escapeHtml(validityNote(c))}</span></div>
      <div class="access-ctrl">
        <label>Gültig bis <input type="date" id="stat-expiry" value="${c.expiresAt ? toInputDate(c.expiresAt) : ""}"></label>
        <button class="icon-btn" data-action="set-expiry" data-code="${cd}">Übernehmen</button>
        <button class="icon-btn" data-action="extend" data-days="30" data-code="${cd}">+ 30 Tage</button>
        <button class="icon-btn" data-action="extend" data-days="90" data-code="${cd}">+ 90 Tage</button>
        <button class="icon-btn" data-action="unlimited" data-code="${cd}">Unbegrenzt</button>
        <span class="spacer"></span>
        ${revokeButton(code, c)}
      </div>

      <h3 class="stat-sub">Angesehene Seiten</h3>
      ${pageRows ? `<table class="simple"><thead><tr><th>Seite</th><th>Zuletzt</th><th>Aufrufe*</th></tr></thead><tbody>${pageRows}</tbody></table>
        <div class="small-note">* gezählt seit Einführung der Auswertung; „–“ = nur der letzte Aufruf ist bekannt.</div>` : `<div class="empty-note">Noch keine Seiten angesehen.</div>`}

      <h3 class="stat-sub">Verlauf</h3>
      ${evRows ? `<div class="tl-wrap"><table class="simple"><tbody>${evRows}</tbody></table></div>` : `<div class="empty-note">Noch keine Einzelereignisse protokolliert.</div>`}
    </div>`;
}

function attachAdminNavHandlers() {
  const toAdmin = document.getElementById("nav-admin");
  if (toAdmin) toAdmin.addEventListener("click", (e) => { e.preventDefault(); if (STATE.route.view !== "admin") setRoute({ view: "admin" }); });
  const toStats = document.getElementById("nav-stats");
  if (toStats) toStats.addEventListener("click", async (e) => { e.preventDefault(); if (STATE.route.view !== "admin_stats") await openStats(); });
}

// Ergebnis einer Zugangsänderung melden und Ansicht aktualisieren
function accessDone(r, okMsg) {
  render();
  if (!r.ok) showToast("Speichern fehlgeschlagen – die Änderung ist NICHT gesichert.", true);
  else if (r.gone) showToast("Dieser Eintrag existiert nicht mehr.", true);
  else showToast(typeof okMsg === "function" ? okMsg(r.co) : okMsg);
}

function attachAccessHandlers() {
  const each = (action, fn) => document.querySelectorAll(`[data-action="${action}"]`).forEach(btn => btn.addEventListener("click", () => fn(btn, btn.getAttribute("data-code"))));
  each("revoke", async (btn, code) => {
    accessDone(await updateCompany(code, (co) => { co.revokedAt = Date.now(); }), "Zugang gesperrt.");
  });
  each("unrevoke", async (btn, code) => {
    accessDone(await updateCompany(code, (co) => { delete co.revokedAt; }),
      (co) => companyStatus(co) === "expired" ? "Freigegeben – die Gültigkeit ist aber abgelaufen, bitte verlängern." : "Zugang wieder freigegeben.");
  });
  each("set-expiry", async (btn, code) => {
    const ts = fromInputDate((document.getElementById("stat-expiry") || {}).value);
    if (!ts) { showToast("Bitte ein Datum wählen (oder „Unbegrenzt“)."); return; }
    accessDone(await updateCompany(code, (co) => { co.expiresAt = ts; }),
      (co) => ts <= Date.now() ? "Datum liegt in der Vergangenheit – der Zugang ist damit abgelaufen." : "Gültig bis " + fmtDay(ts) + ".");
  });
  each("extend", async (btn, code) => {
    const days = parseInt(btn.getAttribute("data-days"), 10) || 30;
    accessDone(await updateCompany(code, (co) => { co.expiresAt = endOfDay(Math.max(Date.now(), co.expiresAt || 0) + days * DAY_MS); }),
      (co) => "Gültig bis " + fmtDay(co.expiresAt) + ".");
  });
  each("unlimited", async (btn, code) => {
    accessDone(await updateCompany(code, (co) => { delete co.expiresAt; }), "Zugang ist jetzt unbegrenzt gültig.");
  });
}

function attachAdminStatsHandlers() {
  attachAdminNavHandlers();
  attachAccessHandlers();
  const logout = document.getElementById("admin-logout");
  if (logout) logout.addEventListener("click", (e) => { e.preventDefault(); STATE.isAdminAuthed = false; setRoute({ view: "login" }); });
  const rf = document.getElementById("stats-refresh");
  if (rf) rf.addEventListener("click", async () => {
    rf.disabled = true;
    await loadStatsData();
    render();
    showToast("Aktualisiert.");
  });
  document.querySelectorAll('[data-action="stats-select"]').forEach(btn => {
    btn.addEventListener("click", () => {
      STATE.statsSel = btn.getAttribute("data-code");
      render();
      const d = document.getElementById("stats-detail");
      if (d && d.scrollIntoView) d.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
}

/* ============================================================
   MAIN RENDER DISPATCH
   ============================================================ */
function render() {
  const root = document.getElementById("root");
  if (STATE.content) ensureIds(STATE.content);
  let r = STATE.route;
  // Besucher mit abgelaufenem/gesperrtem/gelöschtem Zugang kommen nicht weiter (auch nicht per Zurück-Taste)
  if ((r.view === "home" || r.view === "detail" || r.view === "skill") && !STATE.isAdminAuthed) {
    const _st = companyStatus(STATE.companies && STATE.companies[r.code]);
    if (_st !== "active") { STATE.loginError = accessMessage(_st); r = STATE.route = { view: "login" }; }
  }
  if (r.view === "detail" && !(STATE.content && Array.isArray(STATE.content[r.key]) && STATE.content[r.key][r.index])) {
    r = STATE.route = { view: "home", code: r.code };
  }
  if (r.view === "skill") {
    const _rs = resolveSkill(r.name);
    if (!_rs || _rs.page.direct) r = STATE.route = { view: "home", code: r.code };
  }
  let html = "";

  if (r.view === "login") html = renderLogin();
  else if (r.view === "home") html = renderHome(r.code);
  else if (r.view === "skill") html = renderSkillPage(r.code, r);
  else if (r.view === "detail") html = renderDetail(r.code, r.key, r.index);
  else if (r.view === "admin_login") html = renderAdminLogin();
  else if (r.view === "admin") html = renderAdmin();
  else if (r.view === "admin_stats") html = renderAdminStats();

  if (STATE.toast) html += `<div class="toast">${escapeHtml(STATE.toast)}</div>`;

  const _co = (r.view === "home" || r.view === "detail" || r.view === "skill") && STATE.companies ? STATE.companies[r.code] : null;
  applyTheme(_co ? _co.accent : "", _co ? _co.accent2 : "");
  root.innerHTML = html;

  if (r.view === "login") attachLoginHandlers();
  else if (r.view === "home") attachHomeHandlers(r.code);
  else if (r.view === "skill") attachSkillHandlers(r.code);
  else if (r.view === "detail") attachDetailHandlers(r.code, r.key);
  else if (r.view === "admin_login") attachAdminLoginHandlers();
  else if (r.view === "admin") attachAdminHandlers();
  else if (r.view === "admin_stats") attachAdminStatsHandlers();

  hydratePhotos();
  if (STATE.pendingSub) {
    const sid = STATE.pendingSub; STATE.pendingSub = null;
    const el = document.getElementById("sub-" + sid);
    if (el) { el.open = true; el.classList.add("flash"); window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - 14)); }
    else window.scrollTo(0, 0);
  }
}

init();
</script>
